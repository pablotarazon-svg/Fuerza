<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#15171A">
<title>Entreno</title>
<style>
  :root{
    --bg:#15171A; --surface:#1D2025; --surface2:#24282E; --line:#2E333A;
    --chalk:#E9E6DF; --muted:#9BA0A8; --faint:#6B7078;
    --d1:#E2452E; --d2:#3B82E0; --d3:#33A857;
    --accent:var(--d1);
    --fig-body:#E4E8EE; --fig-gear:#8C96A4; --fig-floor:#6E7682;
    --fig-load:#FFA84D; --fig-move:#62D8C6;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
    --disp:"Avenir Next Condensed","AvenirNextCondensed-DemiBold","Arial Narrow",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--chalk);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.4;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky; top:0; z-index:10;
    background:rgba(21,23,26,.93); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  }
  .hrow{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
  h1{font-family:var(--disp); font-weight:600; font-size:21px; letter-spacing:.06em; text-transform:uppercase; margin:0}
  h1 .thin{color:var(--muted); font-weight:400}
  #saveState{font-size:11px; color:var(--faint); font-family:var(--mono); text-align:right; transition:color .3s}
  #saveState.ok{color:#5FBF7A}
  #todayLabel{font-size:13px; color:var(--muted); margin-top:2px}

  .plates{display:flex; gap:9px; justify-content:space-between; padding:13px 2px 3px}
  .plate{
    flex:1; aspect-ratio:1; max-width:66px; border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:3px solid var(--pc); background:transparent; color:var(--pc);
    font-family:var(--disp); cursor:pointer; position:relative; padding:0;
    transition:transform .15s ease, background .15s ease, color .15s ease;
  }
  .plate .num{font-size:21px; font-weight:600; line-height:1}
  .plate .lbl{font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; margin-top:2px; opacity:.85}
  .plate::after{content:""; position:absolute; width:8px; height:8px; border-radius:50%;
    background:var(--bg); border:2px solid currentColor; top:6px; opacity:.55}
  .plate.on{background:var(--pc); color:#101214; transform:scale(1.06)}
  .plate.on::after{background:var(--pc)}
  .plate:active{transform:scale(.95)}
  .plate.aux{border-style:dashed}
  .plate.aux::after{display:none}
  .plate.aux .num{font-size:17px}

  .tabs{display:flex; gap:6px; margin-top:11px; background:var(--surface2); border-radius:12px; padding:4px}
  .tabs button{flex:1; border:none; background:transparent; color:var(--muted); border-radius:9px;
    padding:9px 6px; cursor:pointer; font-family:var(--disp); font-weight:600; font-size:14px;
    letter-spacing:.09em; text-transform:uppercase}
  .tabs button.on{background:var(--chalk); color:#101214}

  .diahead{display:flex; align-items:baseline; gap:9px; margin:16px 2px 9px}
  .diahead:first-child{margin-top:4px}
  .diahead .f{font-family:var(--disp); font-size:16px; font-weight:600; letter-spacing:.06em; text-transform:uppercase}
  .diahead .tot{margin-left:auto; font-family:var(--mono); font-size:11.5px; color:var(--faint)}
  .acard{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px}
  .ahead{display:flex; align-items:center; gap:10px}
  .aico{width:34px; height:34px; border-radius:50%; background:var(--surface2); flex:none;
    display:flex; align-items:center; justify-content:center; font-size:17px}
  .atit{flex:1; min-width:0}
  .aname{display:block; font-family:var(--disp); font-size:16px; font-weight:600; letter-spacing:.03em;
    text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ahora{display:block; font-family:var(--mono); font-size:11.5px; color:var(--faint); margin-top:2px}
  .astats{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:10px}
  .stat{background:var(--surface2); border-radius:9px; padding:6px 9px; min-width:0}
  .stat .k{font-family:var(--mono); font-size:9.5px; color:var(--faint); letter-spacing:.08em; text-transform:uppercase}
  .stat .v{font-family:var(--mono); font-size:14.5px; color:var(--chalk); margin-top:2px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis}
  .stat.dest .v{color:var(--fig-load)}
  .sem{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:13px; margin-bottom:11px}
  .sem.viva{border-color:var(--fig-load)}
  .semh{display:flex; align-items:baseline; gap:9px; margin-bottom:10px}
  .semh .r{font-family:var(--disp); font-size:16px; font-weight:600; letter-spacing:.05em; text-transform:uppercase}
  .semh .f{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--faint)}
  .dep{display:flex; align-items:center; gap:9px; padding:7px 0; border-top:1px solid var(--line)}
  .dep .i{width:26px; text-align:center; font-size:15px; flex:none}
  .dep .nm{font-size:13.5px; color:var(--muted); flex:1}
  .dep .v{font-family:var(--mono); font-size:13.5px; color:var(--chalk); white-space:nowrap}
  .dep .v b{color:var(--fig-load); font-weight:600}
  .semtot{display:flex; gap:8px; margin-top:11px}
  .semtot div{flex:1; background:var(--surface2); border-radius:10px; padding:8px 10px}
  .semtot .k{font-family:var(--mono); font-size:9.5px; color:var(--faint); letter-spacing:.08em; text-transform:uppercase}
  .semtot .v{font-family:var(--mono); font-size:16px; color:var(--chalk); margin-top:2px}

  .lapbtn{margin-top:10px; width:100%; border:1px solid var(--line); background:var(--surface2); color:var(--muted);
    border-radius:10px; padding:9px; font-size:13px; font-family:var(--mono); cursor:pointer}
  .laps{margin-top:8px; display:none}
  .laps.on{display:block}
  .laph, .lapr{display:grid; gap:6px; padding:5px 2px; font-family:var(--mono); font-size:12.5px}
  .laph{color:var(--faint); font-size:10px; letter-spacing:.08em; text-transform:uppercase; border-bottom:1px solid var(--line)}
  .lapr{border-top:1px solid var(--line)}
  .lapr .d{color:var(--chalk)}
  .lapr.rec{opacity:.55}
  .lapr .dest{color:var(--fig-load)}
  .lapr .et{color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  .amap{margin-top:10px; background:var(--surface2); border-radius:11px; padding:6px; cursor:pointer; position:relative}
  .amap .lupa{position:absolute; right:9px; bottom:7px; font-size:11px; color:var(--faint);
    font-family:var(--mono); background:rgba(21,23,26,.75); border-radius:7px; padding:2px 7px}
  .amap:active{opacity:.75}
  .ovl{position:fixed; inset:0; z-index:100; background:var(--bg); display:none; flex-direction:column}
  .ovl.on{display:flex}
  .ovlbar{display:flex; align-items:center; gap:10px; padding:calc(9px + env(safe-area-inset-top)) 13px 9px;
    border-bottom:1px solid var(--line)}
  .ovlbar .t{flex:1; min-width:0}
  .ovlbar .n{font-family:var(--disp); font-size:16px; font-weight:600; letter-spacing:.03em;
    text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block}
  .ovlbar .s{font-family:var(--mono); font-size:11.5px; color:var(--faint); display:block; margin-top:2px}
  .ovlbar button, .ovlbar a{border:1px solid var(--line); background:var(--surface); color:var(--muted);
    border-radius:9px; padding:8px 11px; font-size:13px; cursor:pointer; flex:none; text-decoration:none}
  #mapBox{flex:1; min-height:200px; background:var(--surface2)}
  #mapBox .leaflet-container{width:100%; height:100%; background:var(--surface2)}
  .ovlsvg{padding:14px}
  .ovlsvg svg{width:100%; height:auto}
  .ovlsvg .ruta{fill:none; stroke:var(--fig-load); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
  .ovlsvg .ini{fill:#5FBF7A}
  .ovlsvg .fin{fill:#E2452E}
  .ovlnota{color:var(--faint); font-size:12.5px; text-align:center; padding:0 20px 14px; line-height:1.5}
  .amap svg{display:block; width:100%; height:auto}
  .amap .ruta{fill:none; stroke:var(--fig-load); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
  .amap .ini{fill:#5FBF7A}
  .amap .fin{fill:#E2452E}

  main{padding:15px 13px 80px; max-width:600px; margin:0 auto}

  .daybar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:2px 2px 13px}
  .scheme{font-family:var(--mono); font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:4px 10px}
  .progress{font-family:var(--mono); font-size:12px; color:var(--accent); white-space:nowrap}

  .chip{display:flex; align-items:center; gap:10px; margin:0 2px 16px;
    background:var(--surface); border:1px dashed var(--line); border-radius:12px; padding:10px 12px;
    font-size:14px; color:var(--muted); cursor:pointer; user-select:none}
  .chip .box{width:20px; height:20px; border-radius:6px; border:2px solid var(--faint); flex:none;
    display:flex; align-items:center; justify-content:center; font-size:13px; color:#101214}
  .chip.done{color:var(--chalk)}
  .chip.done .box{background:var(--accent); border-color:var(--accent)}

  .ss{position:relative; padding-left:16px; margin-bottom:22px}
  .ss::before{content:""; position:absolute; left:0; top:24px; bottom:6px; width:3px;
    background:var(--accent); border-radius:2px; opacity:.85}
  .ss-label{font-family:var(--disp); text-transform:uppercase; letter-spacing:.13em;
    font-size:13px; color:var(--accent); margin:0 0 8px 0; font-weight:600}
  .plate .num.dia{font-size:15px; letter-spacing:.05em}
  .ss.bis::before{width:4px}
  .pillbis{display:inline-block; margin-left:8px; padding:2px 8px; border-radius:999px; background:var(--accent);
    color:#101214; font-size:10px; letter-spacing:.12em; vertical-align:2px}
  .ss-desc{background:var(--surface2); border-radius:11px; padding:9px 11px; margin:0 0 10px;
    font-size:13px; line-height:1.5; color:var(--muted); white-space:pre-line}
  .ss-desc b{color:var(--chalk); font-weight:600}
  .ss.info .ss-desc{border:1px dashed var(--line); background:var(--surface)}
  .tagbs{flex:none; align-self:center; min-width:34px; height:26px; border-radius:999px; background:var(--chalk);
    color:#101214; font-family:var(--disp); font-weight:600; font-size:14px; display:flex; align-items:center;
    justify-content:center; padding:0 8px}
  .bislink{display:flex; flex-direction:column; align-items:center; margin:-4px 0 6px}
  .bislink i{width:10px; height:10px; border-radius:50%; background:var(--accent)}
  .bislink span{width:3px; height:12px; background:var(--accent)}
  .bislink em{font-style:normal; font-family:var(--mono); font-size:10px; color:var(--accent); letter-spacing:.08em; margin-top:2px}
  .vid{display:inline-flex; align-items:center; gap:6px; margin-top:8px; padding:7px 11px; border-radius:9px;
    background:#3A1D1A; color:#FF8A7A; font-size:13px; text-decoration:none; font-weight:600}
  .ss-note{color:var(--faint); font-size:11px; letter-spacing:.04em; text-transform:none; margin-left:7px; font-family:var(--mono)}

  .ex{background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:12px 12px 10px; margin-bottom:10px; transition:opacity .2s}
  .ex.done{opacity:.55}
  .ex-head{display:flex; align-items:flex-start; gap:10px}
  .ex-check{width:26px; height:26px; border-radius:50%; border:2px solid var(--faint);
    flex:none; margin-top:1px; background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:#101214; font-size:15px; font-weight:700;
    transition:background .15s,border-color .15s}
  .ex.done .ex-check{background:var(--accent); border-color:var(--accent)}
  .ex-tit{flex:1; min-width:0}
  .ex-name{font-family:var(--disp); font-size:17px; font-weight:600; letter-spacing:.03em; text-transform:uppercase}
  .ex-cue{font-size:12.5px; color:var(--muted); margin-top:1px}
  .tgt{display:inline-block; margin-top:5px; padding:2px 8px; border-radius:999px;
    border:1px solid var(--accent); color:var(--accent); font-family:var(--mono); font-size:11px}
  .hbtn{flex:none; border:none; background:var(--surface2); color:var(--muted);
    width:32px; height:32px; border-radius:9px; cursor:pointer; font-size:15px; padding:0}
  .hbtn.on{color:var(--accent)}

  .ex-fig{display:flex; justify-content:center; padding:8px 0 2px}
  .ex-fig img{max-width:190px; max-height:140px; width:auto; height:auto}
  .ex-fig svg{width:190px; max-width:100%; height:auto}
  .fig .b{stroke:var(--fig-body); stroke-width:7; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .fig .hd{fill:var(--fig-body)}
  .fig .g{stroke:var(--fig-gear); stroke-width:6; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .fig .fl{stroke:var(--fig-floor); stroke-width:5; fill:none; stroke-linecap:round}
  .fig .l{stroke:var(--fig-load); stroke-width:7; fill:none; stroke-linecap:round}
  .fig .ld{fill:var(--fig-load)}
  .fig .m{stroke:var(--fig-move); stroke-width:4.5; fill:none; stroke-linecap:round; stroke-dasharray:9 7}
  .fig .mh{fill:var(--fig-move)}

  .sets{margin-top:10px; display:flex; flex-direction:column; gap:8px}
  .setrow{display:flex; align-items:center; gap:8px}
  .setlbl{font-family:var(--mono); font-size:12px; color:var(--faint); width:22px; flex:none}
  .fld{flex:1; display:flex; align-items:center; gap:6px;
    background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:0 10px}
  .fld:focus-within{border-color:var(--accent)}
  .fld input{flex:1; width:100%; min-width:0; border:none; background:transparent; color:var(--chalk);
    font-family:var(--mono); font-size:17px; padding:11px 0; outline:none}
  .fld .unit{font-size:11px; color:var(--faint); font-family:var(--mono); flex:none}
  .delset{border:none; background:transparent; color:var(--faint); font-size:17px; width:26px; height:38px; cursor:pointer; flex:none; padding:0}
  .addset{margin-top:2px; border:none; background:transparent; color:var(--muted);
    font-size:13px; font-family:var(--mono); cursor:pointer; padding:6px 2px; text-align:left}
  .prev{font-size:12px; color:var(--faint); font-family:var(--mono); margin-top:8px}
  .prev b{color:var(--muted); font-weight:600}
  .hist{margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; display:none}
  .hist.open{display:block}
  .hist-row{display:flex; justify-content:space-between; font-family:var(--mono); font-size:12.5px; padding:3px 0; color:var(--muted)}
  .hist-row .d{color:var(--faint)}
  .hist-empty{font-size:12.5px; color:var(--faint); font-style:italic}

  .addex{background:var(--surface); border:1px dashed var(--line); border-radius:14px; padding:12px; margin-bottom:14px}
  .addex-row{display:flex; gap:8px}
  .addex input{flex:1; min-width:0; background:var(--surface2); border:1px solid var(--line); border-radius:10px;
    color:var(--chalk); font-size:15px; padding:11px 10px; outline:none}
  .addex input:focus{border-color:var(--accent)}
  .addex button{border:none; background:var(--accent); color:#101214; border-radius:10px; padding:0 15px;
    font-family:var(--disp); font-weight:600; font-size:15px; letter-spacing:.05em; text-transform:uppercase; cursor:pointer}
  .addex .tip{color:var(--faint); font-size:12px; margin-top:8px}
  .empty{color:var(--faint); text-align:center; padding:24px 10px 14px; font-size:14px; line-height:1.6}

  .finbtn{display:block; width:100%; margin:6px 0 4px; padding:15px; border:none; border-radius:14px;
    cursor:pointer; background:var(--accent); color:#101214;
    font-family:var(--disp); font-weight:600; font-size:16px; letter-spacing:.08em; text-transform:uppercase}
  .finbtn:active{transform:scale(.98)}

  .sesion{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px}
  .sesion-head{display:flex; align-items:center; gap:9px; margin-bottom:5px}
  .sesion-day{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:var(--disp); font-weight:600; font-size:14px; color:#101214; flex:none}
  .sesion-date{font-family:var(--disp); text-transform:uppercase; letter-spacing:.06em; font-size:15px; font-weight:600}
  .sesion-count{margin-left:auto; color:var(--faint); font-family:var(--mono); font-size:12px}
  .sesion-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    padding:6px 0; border-top:1px dashed var(--line); font-size:13.5px}
  .sesion-row .n{color:var(--muted); min-width:0}
  .sesion-row .v{font-family:var(--mono); color:var(--chalk); white-space:nowrap}

  .sync{display:flex; align-items:center; gap:8px; margin:0 2px 12px; font-family:var(--mono); font-size:11.5px; color:var(--faint)}
  .sync button{border:1px solid var(--line); background:var(--surface); color:var(--muted);
    border-radius:8px; padding:5px 9px; font-size:11.5px; cursor:pointer; font-family:var(--mono)}
  .sesion.act{border-color:#2A3038}
  .sesion-day.act{background:var(--surface2); color:var(--chalk); font-size:14px}
  .actline{padding-top:2px; font-size:13.5px}
  .actline .n{display:block; color:var(--chalk); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .actline .v{display:block; font-family:var(--mono); font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.5}
  .tbl{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:11px 12px; margin-bottom:11px}
  .tbl-h{display:flex; align-items:center; gap:8px; margin-bottom:6px}
  .tbl-dot{width:9px; height:9px; border-radius:50%; flex:none}
  .tbl-name{font-family:var(--disp); font-size:15.5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase}
  .tbl-best{margin-left:auto; font-family:var(--mono); font-size:11.5px; color:var(--faint)}
  .tr{display:grid; grid-template-columns:1fr 62px 62px; gap:6px; padding:5px 0; border-top:1px solid var(--line);
    font-family:var(--mono); font-size:13px}
  .tr.head{border-top:none; color:var(--faint); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase}
  .tr .r{text-align:right}
  .tr .kg{color:var(--fig-load)}
  .tr.top .kg{font-weight:700}

  .memwarn{margin:0 2px 14px; padding:10px 12px; border-radius:12px; font-size:13px;
    background:#3A2A12; color:#E8B00F; display:none}
  footer{text-align:center; color:var(--faint); font-size:11px; font-family:var(--mono); padding:22px 0 10px}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>Entreno <span class="thin">· diario</span></h1>
    <span id="saveState"></span>
  </div>
  <div id="todayLabel"></div>
  <div class="tabs" id="tabs"></div>
  <div class="plates" id="plates"></div>
</header>

<main>
  <div class="memwarn" id="memwarn">⚠️ Vista previa sin almacenamiento: los datos no se guardarán. En la app instalada sí.</div>
  <div class="daybar">
    <span class="scheme" id="scheme"></span>
    <span class="progress" id="progress"></span>
  </div>
  <div class="chip" id="mobChip">
    <span class="box" id="mobBox"></span>
    <span>Calentamiento y movilidad</span>
  </div>
  <div id="content"></div>
  <footer id="foot">los datos se guardan automáticamente en este móvil</footer>
</main>

<div class="ovl" id="mapOv">
  <div class="ovlbar">
    <span class="t"><span class="n" id="ovlName"></span><span class="s" id="ovlSub"></span></span>
    <a id="ovlLink" target="_blank" rel="noopener">Intervals</a>
    <button id="ovlClose">✕</button>
  </div>
  <div id="mapBox"></div>
</div>

<script>

/* ================= almacenamiento ================= */
const KEY = "fuerza-log-v3";
const store = {
  backend:null, mem:{},
  localOk(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }catch(e){ return false; } },
  warn(){ document.getElementById("memwarn").style.display = this.backend === "mem" ? "block" : "none"; },
  async init(){
    if (typeof window.storage !== "undefined" && window.storage && window.storage.get) this.backend = "claude";
    else if (this.localOk()) this.backend = "local";
    else this.backend = "mem";
    this.warn();
  },
  async load(){
    try{
      let v = null;
      if (this.backend === "claude"){ const r = await window.storage.get(KEY); v = r && r.value ? r.value : null; }
      else if (this.backend === "local") v = localStorage.getItem(KEY);
      else v = this.mem[KEY] || null;
      return v ? JSON.parse(v) : null;
    }catch(e){ return null; }
  },
  async save(val){
    const s = JSON.stringify(val);
    const backs = [this.backend].concat(["claude","local","mem"].filter(b => b !== this.backend));
    for (const b of backs){
      try{
        if (b === "claude"){ if (!(typeof window.storage !== "undefined" && window.storage && window.storage.set)) continue; await window.storage.set(KEY, s); }
        else if (b === "local"){ if (!this.localOk()) continue; localStorage.setItem(KEY, s); }
        else this.mem[KEY] = s;
        if (b !== this.backend){ this.backend = b; this.warn(); }
        return b === "mem" ? "mem" : "ok";
      }catch(e){}
    }
    return "err";
  }
};

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtSets(sets){
  return sets.filter(s => s.w !== "" || s.r !== "")
    .map(s => (s.w !== "" ? s.w : "—") + "×" + (s.r !== "" ? s.r : "—")).join(" · ");
}
function fmtDate(iso){
  const p = iso.split("-");
  const m = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return parseInt(p[2],10) + " " + m[parseInt(p[1],10)-1] + (String(new Date().getFullYear()) !== p[0] ? " " + p[0].slice(2) : "");
}
function pastSessions(dayId, exId){
  const arr = (data.hist[dayId] || [])
    .map((s,i) => ({ date:s.date, i:i, e:(s.ex || {})[exId] }))
    .filter(x => exHasData(x.e));
  arr.sort((a,b) => a.date < b.date ? 1 : (a.date > b.date ? -1 : b.i - a.i));
  return arr;
}
function bestSet(sets){
  let best = null;
  sets.forEach(s => {
    const w = num(s.w);
    if (w !== null && (best === null || w > best.w)) best = { w:w, r:s.r };
  });
  return best;
}

function fmtRitmo(t, km, s){

    return m + ":" + String(sg).padStart(2,"0") + "/100m";

function mapaSVG(g, grande){
  if (!g || g.length < 5) return "";
  const latM = g.reduce((a,p) => a + p[0], 0) / g.length;
  const k = Math.cos(latM * Math.PI / 180);
  const xs = g.map(p => p[1] * k), ys = g.map(p => -p[0]);
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  const y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  const w = Math.max(x1-x0, 1e-6), hh = Math.max(y1-y0, 1e-6);
  const W = 300, H = grande ? 260 : 120, pad = 10;
  const esc2 = Math.min((W-2*pad)/w, (H-2*pad)/hh);
  const dx = (W - w*esc2)/2 - x0*esc2, dy = (H - hh*esc2)/2 - y0*esc2;
  const pts = g.map(p => [((p[1]*k)*esc2+dx).toFixed(1), ((-p[0])*esc2+dy).toFixed(1)]);
  const d = "M" + pts.map(p => p[0] + " " + p[1]).join(" L");
  const a = pts[0], b = pts[pts.length-1];
  const svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">' +
    '<path class="ruta" d="' + d + '"/>' +
    '<circle class="ini" cx="' + a[0] + '" cy="' + a[1] + '" r="4"/>' +
    '<circle class="fin" cx="' + b[0] + '" cy="' + b[1] + '" r="4"/></svg>';
  if (grande) return svg;
  return '<div class="amap">' + svg + '<span class="lupa">toca para ampliar</span></div>';
}

let leafletCargando = null, mapa = null;
function cargarLeaflet(){
  if (window.L) return Promise.resolve(true);
  if (leafletCargando) return leafletCargando;
  leafletCargando = new Promise(resolve => {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
    document.head.appendChild(css);
    const js = document.createElement("script");
    js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    js.onload = () => resolve(true);
    js.onerror = () => resolve(false);
    document.head.appendChild(js);
    setTimeout(() => resolve(!!window.L), 6000);
  });
  return leafletCargando;
}

  if (!a.g || a.g.length < 5) return;
  const ov = document.getElementById("mapOv");
  document.getElementById("ovlName").textContent = a.n || tipoEs(a.t) || "Actividad";
  const det = [fmtDate(a.d), fmtHora(a.dt), fmtKm(a.km), fmtDur(a.s), fmtRitmo(a.t, a.km, a.s)]
    .filter(Boolean).join(" · ");
  document.getElementById("ovlSub").textContent = det;
  const link = document.getElementById("ovlLink");
  if (a.id){ link.href = "https://intervals.icu/activities/" + a.id; link.style.display = ""; }
  else link.style.display = "none";
  const box = document.getElementById("mapBox");
  box.innerHTML = '<div class="ovlnota" style="padding-top:22px">cargando mapa…</div>';
  ov.classList.add("on");

  const ok = await cargarLeaflet();
  if (!ov.classList.contains("on")) return;
  if (!ok || !window.L){
    box.innerHTML = '<div class="ovlsvg">' + mapaSVG(a.g, true) + '</div>' +
      '<div class="ovlnota">Sin conexión para el mapa de calles.<br>Este es el trazado de tu recorrido.</div>';
    return;
  }
  box.innerHTML = "";
  try{
    mapa = L.map(box, { zoomControl:true, attributionControl:true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      { maxZoom:18, attribution:"© OpenStreetMap" }).addTo(mapa);
    const linea = L.polyline(a.g, { color:"#FFA84D", weight:4, opacity:.95 }).addTo(mapa);
    L.circleMarker(a.g[0], { radius:6, color:"#5FBF7A", fillColor:"#5FBF7A", fillOpacity:1, weight:2 }).addTo(mapa);
    L.circleMarker(a.g[a.g.length-1], { radius:6, color:"#E2452E", fillColor:"#E2452E", fillOpacity:1, weight:2 }).addTo(mapa);
    mapa.fitBounds(linea.getBounds(), { padding:[24,24] });
    setTimeout(() => { if (mapa) mapa.invalidateSize(); }, 200);
  }catch(e){
    box.innerHTML = '<div class="ovlsvg">' + mapaSVG(a.g, true) + '</div>' +
      '<div class="ovlnota">No se pudo cargar el mapa.<br>Este es el trazado de tu recorrido.</div>';
  }
}

async function loadRuns(){
  try{
    const r = await fetch("runs.json?t=" + Date.now(), { cache:"no-store" });
    if (!r.ok) return false;
    const j = await r.json();
    if (!j || !Array.isArray(j.activities)) return false;
    data.runs = j.activities; data.runsUp = j.updated || null;
    scheduleSave();
    if (section === "act") renderActividades();
    return true;
  }catch(e){ return false; }
}

function fmtSerie(s){
  if (!s) return "—";
  const hh = Math.floor(s/3600), mm = Math.floor((s%3600)/60), ss = Math.round(s%60);
  if (hh) return hh + ":" + String(mm).padStart(2,"0") + ":" + String(ss).padStart(2,"0");
  return mm + ":" + String(ss).padStart(2,"0");
}
function tablaSeries(a){
  const lp = a.lp;
  if (!lp || !lp.length) return "";
  const dep = deporteDe(a.t);
  let cols, cabe, fila;

  if (dep === "correr"){
    cols = "1fr 62px 62px 68px";
    cabe = ["lap","dist","tiempo","ritmo"];
    fila = s => [s.km ? (Math.round(s.km*100)/100).toString().replace(".", ",") + " km" : "—",
                 fmtSerie(s.s),
                 s.km && s.s ? fmtRitmo("Run", s.km, s.s) : "—"];
  } else if (dep === "bici"){
    cols = "1fr 62px 58px 58px";
    cabe = ["lap","tiempo","np","ppm"];
    fila = s => [fmtSerie(s.s), s.w ? s.w + " W" : "—", s.hr ? s.hr : "—"];
  } else if (dep === "nadar"){
    cols = "1fr 62px 62px 76px";
    cabe = ["lap","dist","tiempo","ritmo"];
    fila = s => [s.km ? Math.round(s.km*1000) + " m" : "—",
                 fmtSerie(s.s),
                 s.km && s.s ? fmtRitmo("Swim", s.km, s.s) : "—"];
  } else {
    cols = "1fr 80px";
    cabe = ["lap","tiempo"];
    fila = s => [fmtSerie(s.s)];
  }

  let h = '<button class="lapbtn">▸ ver laps (' + lp.length + ')</button><div class="laps">';
  h += '<div class="laph" style="grid-template-columns:' + cols + '">' +
       cabe.map(c => '<span>' + c + '</span>').join("") + '</div>';
  lp.forEach(s => {
    const v = fila(s);
    h += '<div class="lapr' + (s.tp === "RECO" ? " rec" : "") + '" style="grid-template-columns:' + cols + '">';
    h += '<span class="et">' + esc(s.n) + '</span>';
    v.forEach((val,i) => {
      h += '<span class="d' + (i === v.length-1 ? " dest" : "") + '">' + esc(val) + '</span>';
    });
    h += '</div>';
  });
  h += '</div>';
  return h;
}

/* ================= vista: actividades por día ================= */
function renderActividades(){
  document.documentElement.style.setProperty("--accent", "#FFA84D");
  const cont = document.getElementById("content");
  cont.className = "";
  cont.innerHTML = "";

  const sync = document.createElement("div");
  sync.className = "sync";
  const n = (data.runs || []).length;
  sync.innerHTML = '<span>' + (n ? n + " actividades" + (data.runsUp ? " · " + fmtDate(String(data.runsUp).slice(0,10)) : "")
                                 : "sin actividades sincronizadas") + '</span>';
  const rb = document.createElement("button");
  rb.textContent = "↻ actualizar";
  rb.onclick = async () => {
    rb.textContent = "…";
    const ok = await loadRuns();
    if (ok) renderActividades();
    else { rb.textContent = "no disponible"; setTimeout(() => { rb.textContent = "↻ actualizar"; }, 2000); }
  };
  sync.appendChild(rb);
  cont.appendChild(sync);

  const acts = (data.runs || []).slice().sort((a,b) => (a.dt || a.d) < (b.dt || b.d) ? 1 : -1);
  if (!acts.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = 'Aquí aparecerán tus carreras y salidas,<br>día a día, con ritmo, tiempo y recorrido.';
    cont.appendChild(e);
    return;
  }

  let diaActual = null;
  acts.forEach(a => {
    if (a.d !== diaActual){
      diaActual = a.d;
      const delDia = acts.filter(x => x.d === a.d);
      const km = delDia.reduce((s,x) => s + (x.km || 0), 0);
      const seg = delDia.reduce((s,x) => s + (x.s || 0), 0);
      const hd = document.createElement("div");
      hd.className = "diahead";
      hd.innerHTML = '<span class="f">' + (a.d === TODAY ? "Hoy" : nomDia(a.d) + " " + fmtDate(a.d)) + '</span>' +
        '<span class="tot">' + [km ? fmtKm(km) : "", fmtDur(seg)].filter(Boolean).join(" · ") + '</span>';
      cont.appendChild(hd);
    }

    const c = document.createElement("div");
    c.className = "acard";
    let x = '<div class="ahead"><span class="aico">' + icono(a.t) + '</span>';
    x += '<span class="atit"><span class="aname">' + esc(a.n || a.t || "Actividad") + '</span>';
    x += '<span class="ahora">' + [fmtHora(a.dt), tipoEs(a.t)].filter(Boolean).join(" · ") + '</span></span></div>';

    const stats = [];
    const dep = deporteDe(a.t);
    const km = a.km ? ["distancia", fmtKm(a.km), true] : null;
    const tiempo = a.s ? ["tiempo", fmtDur(a.s), false] : null;
    const pulso = a.hr ? ["pulso medio", Math.round(a.hr) + " ppm", false] : null;
    const subida = a.up ? ["desnivel", Math.round(a.up) + " m+", false] : null;
    const ritmo = fmtRitmo(a.t, a.km, a.s);

    if (dep === "correr"){
      if (km) stats.push(km);
      if (tiempo) stats.push(tiempo);
      if (ritmo) stats.push(["ritmo", ritmo, true]);
      if (pulso) stats.push(pulso);
      if (subida) stats.push(subida);
    } else if (dep === "bici"){
      if (km) stats.push(km);
      if (tiempo) stats.push(tiempo);
      stats.push(["np", a.np ? Math.round(a.np) + " W" : "—", true]);
      if (a.pw) stats.push(["potencia media", Math.round(a.pw) + " W", false]);
      if (pulso) stats.push(pulso);
      if (ritmo) stats.push(["velocidad", ritmo, false]);
      if (subida) stats.push(subida);
    } else if (dep === "nadar"){
      if (a.km) stats.push(["distancia", a.km < 3 ? Math.round(a.km*1000) + " m" : fmtKm(a.km), true]);
      if (tiempo) stats.push(tiempo);
      if (ritmo) stats.push(["ritmo", ritmo, true]);
      if (pulso) stats.push(pulso);
    } else if (dep === "fuerza"){
      if (tiempo) stats.push(tiempo);
      if (pulso) stats.push(pulso);
    } else {
      if (km) stats.push(km);
      if (tiempo) stats.push(tiempo);
      if (ritmo) stats.push(["ritmo", ritmo, true]);
      if (pulso) stats.push(pulso);
      if (subida) stats.push(subida);
    }
    if (stats.length){
      x += '<div class="astats">';
      stats.forEach(s => {
        x += '<div class="stat' + (s[2] ? " dest" : "") + '"><div class="k">' + s[0] + '</div><div class="v">' + esc(s[1]) + '</div></div>';
      });
      x += '</div>';
    }
    x += mapaSVG(a.g);
    x += tablaSeries(a);
    c.innerHTML = x;
    const m = c.querySelector(".amap");
    if (m) m.onclick = () => abrirMapa(a);
    const lb = c.querySelector(".lapbtn");
    if (lb) lb.onclick = () => {
      const t = c.querySelector(".laps");
      const ab = t.classList.toggle("on");
      lb.textContent = (ab ? "▾ ocultar laps" : "▸ ver laps (" + a.lp.length + ")");
    };
    cont.appendChild(c);
  });
}

/* ================= vista: resumen por semanas ================= */
function renderSemanas(){
  document.documentElement.style.setProperty("--accent", "#FFA84D");
  const cont = document.getElementById("content");
  cont.className = "";
  cont.innerHTML = "";

  const acts = data.runs || [];
  if (!acts.length){
    cont.innerHTML = '<div class="empty">Aquí verás el resumen de cada semana<br>por deporte, horas y kilómetros.</div>';
    return;
  }

  const semanas = {};
  acts.forEach(a => {
    if (!a.d) return;
    const L = lunesDe(a.d);
    if (!semanas[L]) semanas[L] = { seg:0, ses:0, dep:{} };
    const S = semanas[L];
    const k = deporteDe(a.t);
    if (!S.dep[k]) S.dep[k] = { seg:0, km:0, ses:0 };
    S.dep[k].seg += a.s || 0;
    S.dep[k].km += a.km || 0;
    S.dep[k].ses += 1;
    S.seg += a.s || 0;
    S.ses += 1;
  });

  const lunesHoy = lunesDe(TODAY);
  Object.keys(semanas).sort().reverse().slice(0, 26).forEach(L => {
    const S = semanas[L];
    const p = L.split("-");
    const ini = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
    const fin = new Date(ini); fin.setDate(fin.getDate() + 6);
    const viva = L === lunesHoy;

    const c = document.createElement("div");
    c.className = "sem" + (viva ? " viva" : "");
    let x = '<div class="semh"><span class="r">' + (viva ? "Esta semana" : fmtDate(L) + " – " + fmtDate(isoLocal(fin))) + '</span>';
    if (viva) x += '<span class="f">' + fmtDate(L) + " – " + fmtDate(isoLocal(fin)) + '</span>';
    x += '</div>';

    DEPORTES.forEach(d => {
      const v = S.dep[d.k];
      if (!v) return;
      const partes = [sumaDur(v.seg)];
      if (d.km && v.km) partes.push(Math.round(v.km * 10) / 10 + " km");
      x += '<div class="dep"><span class="i">' + d.i + '</span><span class="nm">' + d.n +
           ' <span style="color:var(--faint)">· ' + v.ses + '</span></span>' +
           '<span class="v"><b>' + partes[0] + '</b>' + (partes[1] ? " · " + partes[1].replace(".", ",") : "") + '</span></div>';
    });
    const o = S.dep["otros"];
    if (o) x += '<div class="dep"><span class="i">•</span><span class="nm">Otros <span style="color:var(--faint)">· ' +
      o.ses + '</span></span><span class="v"><b>' + sumaDur(o.seg) + '</b></span></div>';

    x += '<div class="semtot"><div><div class="k">Total horas</div><div class="v">' + sumaDur(S.seg) + '</div></div>' +
         '<div><div class="k">Sesiones</div><div class="v">' + S.ses + '</div></div></div>';
    c.innerHTML = x;
    cont.appendChild(c);
  });
}

/* ================= vista: día ================= */
function finalizar(day){
  const s = data.cur[day.id];
  const el = document.getElementById("saveState");
  if (!sessHasData(s)){ el.textContent = "nada que guardar"; el.classList.remove("ok"); return; }
  if (!finArmed){
    finArmed = true;
    clearTimeout(finTimer);
    finTimer = setTimeout(() => { finArmed = false; if (currentView === "day") renderDay(); }, 4000);
    renderDay();
    return;
  }
  finArmed = false; clearTimeout(finTimer);
  s.date = TODAY;
  if (!data.hist[day.id]) data.hist[day.id] = [];
  data.hist[day.id].push(s);
  data.cur[day.id] = null;
  scheduleSave();
  currentView = "hist";
  render();
}

function addCustom(dayId, name){
  name = (name || "").trim();
  if (!name) return;
  if (!data.custom[dayId]) data.custom[dayId] = [];
  data.custom[dayId].push({ id:"x_" + dayId + "_" + Date.now().toString(36), n:name.slice(0,48) });
  scheduleSave();
  renderDay();
}
function delCustom(dayId, exId){
  data.custom[dayId] = (data.custom[dayId] || []).filter(c => c.id !== exId);
  const cur = data.cur[dayId];
  if (cur && cur.ex) delete cur.ex[exId];
  scheduleSave();
  renderDay();
}

function renderDay(){
  const day = dayObj(currentDay);
  document.documentElement.style.setProperty("--accent", day.color);
  document.getElementById("scheme").textContent = day.scheme;
  const cur = ensureCur(currentDay);

  const mobChip = document.getElementById("mobChip");
  const mobBox = document.getElementById("mobBox");
  mobChip.classList.toggle("done", !!cur.mob);
  mobBox.textContent = cur.mob ? "✓" : "";
  mobChip.onclick = () => { cur.mob = !cur.mob; scheduleSave(); renderDay(); };

  const cont = document.getElementById("content");
  cont.innerHTML = "";
  const groups = dayGroups(currentDay);

  if (!groups.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = day.dia + ' todavía sin ejercicios.<br>Añádelos abajo o dímelos y te los monto con su dibujo.';
    cont.appendChild(e);
  }

  groups.forEach(g => {
    const ss = document.createElement("section");
    ss.className = "ss" + (g.bis ? " bis" : "") + (g.info ? " info" : "");
    ss.innerHTML = '<h2 class="ss-label">' + esc(g.name) + (g.bis ? '<span class="pillbis">BISERIE</span>' : '') +
      (g.note ? '<span class="ss-note">' + esc(g.note) + '</span>' : '') + '</h2>' +
      (g.desc ? '<div class="ss-desc">' + esc(g.desc) + '</div>' : '');

    g.ex.forEach((ex, ei) => {
      if (g.bis && ei > 0){
        const lk = document.createElement("div");
        lk.className = "bislink";
        lk.innerHTML = '<i></i><span></span><i></i><em>A CONTINUACIÓN</em>';
        ss.appendChild(lk);
      }
      const st = ensureEx(currentDay, ex);
      const card = document.createElement("div");
      card.className = "ex" + (st.done ? " done" : "");
      const histOpen = openHists.has(ex.id);
      let h = '';
      h += '<div class="ex-head">';
      h += '<button class="ex-check" aria-label="hecho">' + (st.done ? "✓" : "") + '</button>';
      h += '<div class="ex-tit"><div class="ex-name">' + esc(ex.n) + '</div>';
      if (ex.c) h += '<div class="ex-cue">' + esc(ex.c) + '</div>';
      if (ex.t) h += '<span class="tgt">' + esc(ex.t) + '</span>';
      if (ex.v) h += '<br><a class="vid" href="' + esc(ex.v) + '" target="_blank" rel="noopener">▶ Ver vídeo</a>';
      h += '</div>';
      if (ex.tag) h += '<span class="tagbs">' + esc(ex.tag) + '</span>';
      h += '<button class="hbtn' + (histOpen ? " on" : "") + '" aria-label="histórico">🕘</button>';
      if (g.custom) h += '<button class="hbtn delex" aria-label="borrar">✕</button>';
      h += '</div>';

      if (ex.fig && FIGS[ex.fig]) h += '<div class="ex-fig"><img src="data:image/png;base64,' + FIGS[ex.fig] + '" alt="' + esc(ex.n) + '"></div>';
      else if (ex.svg && SVGS[ex.svg]) h += '<div class="ex-fig">' + SVGS[ex.svg] + '</div>';

      h += '<div class="sets">';
      st.sets.forEach((s,i) => {
        h += '<div class="setrow" data-i="' + i + '">';
        h += '<span class="setlbl">S' + (i+1) + '</span>';
        if (!ex.nokg) h += '<div class="fld"><input type="text" inputmode="decimal" placeholder="' + (ex.bw ? "corporal" : "kg") + '" value="' + esc(s.w) + '" data-f="w"><span class="unit">kg</span></div>';
        h += '<div class="fld"><input type="text" inputmode="' + (ex.ur === "tiempo" ? "text" : "numeric") + '" placeholder="' + esc(ex.pr || "reps") + '" value="' + esc(s.r) + '" data-f="r"><span class="unit">' + esc(ex.ur || "reps") + '</span></div>';
        h += (st.sets.length > 1 && i === st.sets.length - 1) ? '<button class="delset" aria-label="quitar serie">−</button>' : '<span style="width:26px;flex:none"></span>';
        h += '</div>';
      });
      h += '</div><button class="addset">+ añadir serie</button>';

      const past = pastSessions(currentDay, ex.id);
      if (past.length) h += '<div class="prev">Última vez (' + fmtDate(past[0].date) + '): <b>' + esc(fmtSets(past[0].e.sets)) + '</b></div>';
      h += '<div class="hist' + (histOpen ? " open" : "") + '">';
      if (past.length) past.slice(0,8).forEach(p => {
        h += '<div class="hist-row"><span class="d">' + fmtDate(p.date) + '</span><span>' + esc(fmtSets(p.e.sets)) + '</span></div>';
      });
      else h += '<div class="hist-empty">sin registros anteriores</div>';
      h += '</div>';
      card.innerHTML = h;

      card.querySelector(".ex-check").onclick = () => { st.done = !st.done; scheduleSave(); renderDay(); };
      card.querySelector(".hbtn").onclick = () => {
        if (openHists.has(ex.id)) openHists.delete(ex.id); else openHists.add(ex.id);
        renderDay();
      };
      const dx = card.querySelector(".delex");
      if (dx) dx.onclick = () => delCustom(currentDay, ex.id);
      card.querySelector(".addset").onclick = () => {
        if (st.sets.length < 8){ st.sets.push({w:"",r:""}); scheduleSave(); renderDay(); }
      };
      const del = card.querySelector(".delset");
      if (del) del.onclick = () => { st.sets.pop(); scheduleSave(); renderDay(); };
      card.querySelectorAll("input").forEach(inp => {
        inp.oninput = () => {
          const i = parseInt(inp.closest(".setrow").dataset.i, 10);
          st.sets[i][inp.dataset.f] = inp.value.trim();
          scheduleSave(); updateProgress();
        };
      });
      ss.appendChild(card);
    });
    cont.appendChild(ss);
  });

  // añadir ejercicio propio
  const add = document.createElement("div");
  add.className = "addex";
  add.innerHTML = '<div class="addex-row"><input type="text" placeholder="Nombre del ejercicio" maxlength="48"><button>Añadir</button></div>' +
                  '<div class="tip">Se guarda en este día con sus casillas de kg y reps.</div>';
  const ai = add.querySelector("input"), ab = add.querySelector("button");
  ab.onclick = () => { addCustom(currentDay, ai.value); };
  ai.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); addCustom(currentDay, ai.value); } };
  cont.appendChild(add);

  if (groups.length){
    const fin = document.createElement("button");
    fin.className = "finbtn";
    fin.textContent = finArmed ? "¿Seguro? Toca otra vez para archivar" : "✓ Finalizar sesión y guardar";
    fin.onclick = () => finalizar(day);
    cont.appendChild(fin);
  }
  updateProgress();

  function updateProgress(){
    let t = 0, d = 0;
    allEx(currentDay).forEach(ex => { t++; if (ensureEx(currentDay, ex).done) d++; });
    document.getElementById("progress").textContent = t ? (d + "/" + t + " hechos") : "";
  }
}

/* ================= vista: diario (fuerza + carreras) ================= */
function renderHist(){
  document.documentElement.style.setProperty("--accent", "#C9CEDA");
  const cont = document.getElementById("content");
  const rows = [];

  PLAN.forEach(day => {
    const names = {}; allEx(day.id).forEach(e => names[e.id] = e.n);
    (data.hist[day.id] || []).forEach((sess,i) => {
      const items = [];
      Object.keys(sess.ex || {}).forEach(id => {
        if (exHasData(sess.ex[id])) items.push({ n:names[id] || LEGACY[id] || "Ejercicio", v:fmtSets(sess.ex[id].sets) });
      });
      if (items.length || sess.mob) rows.push({ k:"s", date:sess.date, i:i, day:day, items:items, mob:!!sess.mob });
    });
  });
  rows.sort((x,y) => x.date < y.date ? 1 : (x.date > y.date ? -1 : y.i - x.i));

  cont.innerHTML = "";

  if (!rows.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = 'Aún no hay sesiones finalizadas.<br>Apunta tus pesos y toca «Finalizar sesión».';
    cont.appendChild(e);
    return;
  }

  rows.forEach(r => {
    const c = document.createElement("div");
    if (r.k === "s"){
      c.className = "sesion";
      let x = '<div class="sesion-head"><span class="sesion-day" style="background:' + r.day.color + '">' + (r.day.corto || r.day.num) + '</span>';
      x += '<span class="sesion-date">' + (r.date === TODAY ? "hoy · " : "") + fmtDate(r.date) + '</span>';
      x += '<span class="sesion-count">' + r.items.length + ' ejercicio' + (r.items.length === 1 ? "" : "s") + (r.mob ? " + mov." : "") + '</span></div>';
      r.items.forEach(it => {
        x += '<div class="sesion-row"><span class="n">' + esc(it.n) + '</span><span class="v">' + esc(it.v) + '</span></div>';
      });
      c.innerHTML = x;
    } else {
      const a = r.a;
      const det = [fmtKm(a.km), fmtDur(a.s), fmtRitmo(a.t, a.km, a.s), a.up ? Math.round(a.up) + " m+" : "", a.hr ? Math.round(a.hr) + " ppm" : ""]
        .filter(Boolean).join(" · ");
      c.className = "sesion act";
      let x = '<div class="sesion-head"><span class="sesion-day act">' + icono(a.t) + '</span>';
      x += '<span class="sesion-date">' + (r.date === TODAY ? "hoy · " : "") + fmtDate(r.date) + '</span>';
      x += '<span class="sesion-count">' + esc(a.l ? "carga " + Math.round(a.l) : tipoEs(a.t)) + '</span></div>';
      x += '<div class="actline"><span class="n">' + esc(a.n || a.t || "Actividad") + '</span><span class="v">' + esc(det) + '</span></div>';
      c.innerHTML = x;
    }
    cont.appendChild(c);
  });
}

/* ================= vista: tabla fecha / kg ================= */
function renderTabla(){
  document.documentElement.style.setProperty("--accent", "#C9CEDA");
  const cont = document.getElementById("content");
  cont.innerHTML = "";
  let any = false;

  PLAN.forEach(day => {
    const lista = allEx(day.id).slice();
    const vistos = new Set(lista.map(e => e.id));
    (data.hist[day.id] || []).forEach(s => Object.keys(s.ex || {}).forEach(id => {
      if (!vistos.has(id) && exHasData(s.ex[id])){ vistos.add(id); lista.push({ id:id, n:LEGACY[id] || "Ejercicio" }); }
    }));
    lista.forEach(ex => {
      const past = (data.hist[day.id] || [])
        .map((s,i) => ({ date:s.date, i:i, e:(s.ex || {})[ex.id] }))
        .filter(x => exHasData(x.e));
      if (!past.length) return;
      any = true;
      past.sort((a,b) => a.date < b.date ? 1 : (a.date > b.date ? -1 : b.i - a.i));

      let record = null;
      past.forEach(p => { const b = bestSet(p.e.sets); if (b && (record === null || b.w > record)) record = b.w; });

      const box = document.createElement("div");
      box.className = "tbl";
      let h = '<div class="tbl-h"><span class="tbl-dot" style="background:' + day.color + '"></span>';
      h += '<span class="tbl-name">' + esc(ex.n) + '</span>';
      h += '<span class="tbl-best">' + (record !== null ? "máx " + String(record).replace(".", ",") + " kg" : String(past.length) + " ses.") + '</span></div>';
      h += '<div class="tr head"><span>fecha</span><span class="r">kg</span><span class="r">reps</span></div>';
      past.forEach(p => {
        const b = bestSet(p.e.sets);
        const kg = b ? String(b.w).replace(".", ",") : "—";
        const rp = b && b.r !== "" ? b.r : (p.e.sets.find(s => s.r) ? p.e.sets.find(s => s.r).r : "—");
        const top = (b && record !== null && b.w === record) ? " top" : "";
        h += '<div class="tr' + top + '"><span>' + fmtDate(p.date) + '</span><span class="r kg">' + esc(kg) + '</span><span class="r">' + esc(rp) + '</span></div>';
      });
      box.innerHTML = h;
      cont.appendChild(box);
    });
  });

  if (!any) cont.innerHTML = '<div class="empty">La tabla se llena al finalizar sesiones.<br>Cada ejercicio tendrá su fecha, kg y reps.</div>';
}

/* ================= render ================= */
function render(){
  renderTabs();
  const esFuerza = section === "fuerza";
  const daybar = document.querySelector(".daybar");
  const mob = document.getElementById("mobChip");
  const foot = document.getElementById("foot");
  const plates = document.getElementById("plates");

  plates.style.display = esFuerza ? "flex" : "none";
  if (!esFuerza){
    daybar.style.display = "none";
    mob.style.display = "none";
    foot.style.display = "none";
    if (section === "sem") renderSemanas(); else renderActividades();
    return;
  }
  renderPlates();
  const dayView = currentView === "day";
  daybar.style.display = dayView ? "flex" : "none";
  mob.style.display = dayView ? "flex" : "none";
  foot.style.display = dayView ? "block" : "none";
  if (currentView === "hist") renderHist();
  else if (currentView === "tabla") renderTabla();
  else renderDay();
}

document.getElementById("ovlClose").onclick = cerrarMapa;
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarMapa(); });

/* ================= init ================= */
(async function(){
  const meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const dias = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const now = new Date();
  document.getElementById("todayLabel").textContent =
    dias[now.getDay()] + " " + now.getDate() + " de " + meses[now.getMonth()] + " · sesión de hoy";
  await store.init();
  const loaded = await store.load();
  if (loaded && loaded.hist){
    data = { hist:loaded.hist || {}, cur:loaded.cur || {}, custom:loaded.custom || {},
             runs:loaded.runs || [], runsUp:loaded.runsUp || null };
  }
  render();
  loadRuns();
})();
