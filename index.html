<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#15171A">
<meta name="apple-mobile-web-app-title" content="Entreno">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Entreno</title>
<style>
  :root{
    --bg:#15171A; --surface:#1D2025; --surface2:#24282E; --line:#2E333A;
    --chalk:#E9E6DF; --muted:#9BA0A8; --faint:#6B7078;
    --d1:#E2452E; --d2:#3B82E0; --d3:#33A857;
    --accent:var(--d1);
    --fig-body:#E4E8EE; --fig-gear:#8C96A4; --fig-floor:#6E7682;
    --fig-load:#FFA84D; --fig-move:#62D8C6;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
    --disp:"Avenir Next Condensed","AvenirNextCondensed-DemiBold","Arial Narrow",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--chalk);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.4;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky; top:0; z-index:10;
    background:rgba(21,23,26,.93); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  }
  .hrow{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
  h1{font-family:var(--disp); font-weight:600; font-size:21px; letter-spacing:.06em; text-transform:uppercase; margin:0}
  h1 .thin{color:var(--muted); font-weight:400}
  #saveState{font-size:11px; color:var(--faint); font-family:var(--mono); text-align:right; transition:color .3s}
  #saveState.ok{color:#5FBF7A}
  #todayLabel{font-size:13px; color:var(--muted); margin-top:2px}

  .plates{display:flex; gap:9px; justify-content:space-between; padding:13px 2px 3px}
  .plate{
    flex:1; aspect-ratio:1; max-width:66px; border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:3px solid var(--pc); background:transparent; color:var(--pc);
    font-family:var(--disp); cursor:pointer; position:relative; padding:0;
    transition:transform .15s ease, background .15s ease, color .15s ease;
  }
  .plate .num{font-size:21px; font-weight:600; line-height:1}
  .plate .lbl{font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; margin-top:2px; opacity:.85}
  .plate::after{content:""; position:absolute; width:8px; height:8px; border-radius:50%;
    background:var(--bg); border:2px solid currentColor; top:6px; opacity:.55}
  .plate.on{background:var(--pc); color:#101214; transform:scale(1.06)}
  .plate.on::after{background:var(--pc)}
  .plate:active{transform:scale(.95)}
  .plate.aux{border-style:dashed}
  .plate.aux::after{display:none}
  .plate.aux .num{font-size:17px}

  .tabs{display:flex; gap:6px; margin-top:11px; background:var(--surface2); border-radius:12px; padding:4px}
  .tabs button{flex:1; border:none; background:transparent; color:var(--muted); border-radius:9px;
    padding:9px 6px; cursor:pointer; font-family:var(--disp); font-weight:600; font-size:14px;
    letter-spacing:.09em; text-transform:uppercase}
  .tabs button.on{background:var(--chalk); color:#101214}
  .tabs button{font-size:11px; letter-spacing:.03em; line-height:1.15; padding:8px 2px}
  .tabs{gap:3px}

  .calbar{display:flex; align-items:center; gap:7px; margin:2px 0 12px}
  .calbar .nav{border:1px solid var(--line); background:var(--surface); color:var(--chalk); border-radius:9px;
    width:36px; height:34px; font-size:17px; cursor:pointer; flex:none}
  .calbar .tit{flex:1; text-align:center; font-family:var(--disp); font-weight:600; font-size:16px;
    letter-spacing:.05em; text-transform:uppercase}
  .calmodo{display:flex; gap:6px; margin-bottom:10px}
  .calmodo button{flex:1; border:1px solid var(--line); background:var(--surface); color:var(--muted);
    border-radius:9px; padding:8px; font-size:13px; cursor:pointer}
  .calmodo button.on{background:var(--surface2); color:var(--chalk); border-color:var(--fig-load)}
  .calmodo .hoy{flex:none; padding:8px 12px}
  .cday{margin-bottom:14px}
  .cdh{display:flex; align-items:baseline; gap:8px; margin:0 2px 7px}
  .cdh .dn{font-family:var(--disp); font-weight:600; font-size:16px; letter-spacing:.05em; text-transform:uppercase}
  .cdh .df{font-family:var(--mono); font-size:11.5px; color:var(--faint)}
  .cday.hoy .dn{color:var(--fig-load)}
  .hoytag{margin-left:auto; font-family:var(--mono); font-size:10px; color:#101214; background:var(--fig-load);
    border-radius:999px; padding:2px 8px; letter-spacing:.08em}
  .cvacio{border:1px dashed var(--line); border-radius:12px; padding:10px 12px; color:var(--faint); font-size:13px}
  .cev{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:8px}
  .cev.nota{border-style:dashed}
  .cev .ahead{align-items:flex-start}
  .hecho{flex:none; align-self:center; font-family:var(--mono); font-size:11px; color:#101214; background:#5FBF7A;
    border-radius:999px; padding:3px 8px}
  .cmeta{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
  .cmeta span{background:var(--surface2); border-radius:8px; padding:4px 9px; font-family:var(--mono); font-size:12.5px; color:var(--chalk)}
  .cdesc{margin-top:9px; background:var(--surface2); border-radius:10px; padding:9px 11px; font-family:var(--mono);
    font-size:12.5px; line-height:1.55; color:var(--muted); white-space:pre-wrap; overflow:hidden}
  .cdesc.corto{max-height:7.9em; position:relative}
  .cdesc.corto::after{content:""; position:absolute; left:0; right:0; bottom:0; height:2.2em;
    background:linear-gradient(transparent, var(--surface2))}
  .cmas{border:none; background:transparent; color:var(--fig-load); font-size:12.5px; font-family:var(--mono);
    padding:6px 2px 0; cursor:pointer}
  .cday.flash{animation:parp 1.4s ease}
  @keyframes parp{0%{background:rgba(255,168,77,.22)} 100%{background:transparent}}
  .cday{border-radius:12px}
  .cnadd{display:block; width:100%; margin-top:6px; border:1px dashed var(--line); background:transparent;
    color:var(--faint); border-radius:10px; padding:8px; font-size:12.5px; cursor:pointer; text-align:left}
  .cnota{margin-top:6px; background:#1F2A22; border:1px solid #2E4A36; border-radius:12px; padding:10px 11px}
  .cnh{display:flex; align-items:center; justify-content:space-between; font-size:12px; color:#8FD3A4;
    font-family:var(--mono); letter-spacing:.04em; margin-bottom:5px}
  .cntx{font-size:14px; color:var(--chalk); white-space:pre-wrap; line-height:1.5}
  .cned{border:none; background:transparent; color:#8FD3A4; font-size:12px; cursor:pointer; padding:0}
  .cnin{width:100%; background:var(--surface2); border:1px solid #2E4A36; border-radius:9px; color:var(--chalk);
    font-size:15px; padding:9px; outline:none; resize:vertical; font-family:inherit}
  .cnbt{display:flex; gap:7px; margin-top:7px}
  .cnbt button{flex:1; border:1px solid var(--line); background:var(--surface2); color:var(--chalk);
    border-radius:9px; padding:9px; font-size:13px; cursor:pointer}
  .cnbt .cnok{background:#5FBF7A; color:#101214; border-color:#5FBF7A; font-weight:600}
  .cnbt .cndel{color:#E2452E}
  .mgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:14px}
  .mgrid .wd{text-align:center; font-family:var(--mono); font-size:10.5px; color:var(--faint); padding:2px 0 4px}
  .mcel{background:var(--surface); border:1px solid var(--line); border-radius:9px; min-height:52px; padding:4px 3px;
    cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px}
  .mcel .n{font-family:var(--mono); font-size:12px; color:var(--chalk)}
  .mcel .ic{font-size:11px; line-height:1.1; text-align:center}
  .mcel.fuera{opacity:.35}
  .mcel.hoy{border-color:var(--fig-load)}
  .mcel.hoy .n{color:var(--fig-load); font-weight:700}
  .mcel.sel{background:var(--surface2); border-color:var(--chalk)}
  .calpie{font-family:var(--mono); font-size:11px; color:var(--faint); display:flex; align-items:center; gap:8px; margin:4px 2px 12px}
  .calpie button{border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:8px;
    padding:5px 9px; font-size:11.5px; font-family:var(--mono); cursor:pointer}

  .diahead{display:flex; align-items:baseline; gap:9px; margin:16px 2px 9px}
  .diahead:first-child{margin-top:4px}
  .diahead .f{font-family:var(--disp); font-size:16px; font-weight:600; letter-spacing:.06em; text-transform:uppercase}
  .diahead .tot{margin-left:auto; font-family:var(--mono); font-size:11.5px; color:var(--faint)}
  .acard{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px}
  .ahead{display:flex; align-items:center; gap:10px}
  .aico{width:34px; height:34px; border-radius:50%; background:var(--surface2); flex:none;
    display:flex; align-items:center; justify-content:center; font-size:17px}
  .atit{flex:1; min-width:0}
  .aname{display:block; font-family:var(--disp); font-size:16px; font-weight:600; letter-spacing:.03em;
    text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ahora{display:block; font-family:var(--mono); font-size:11.5px; color:var(--faint); margin-top:2px}
  .astats{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:10px}
  .stat{background:var(--surface2); border-radius:9px; padding:6px 9px; min-width:0}
  .stat .k{font-family:var(--mono); font-size:9.5px; color:var(--faint); letter-spacing:.08em; text-transform:uppercase}
  .stat .v{font-family:var(--mono); font-size:14.5px; color:var(--chalk); margin-top:2px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis}
  .stat.dest .v{color:var(--fig-load)}
  .sem{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:13px; margin-bottom:11px}
  .sem.viva{border-color:var(--fig-load)}
  .semh{display:flex; align-items:baseline; gap:9px; margin-bottom:10px}
  .semh .r{font-family:var(--disp); font-size:16px; font-weight:600; letter-spacing:.05em; text-transform:uppercase}
  .semh .f{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--faint)}
  .dep{display:flex; align-items:center; gap:9px; padding:7px 0; border-top:1px solid var(--line)}
  .dep .i{width:26px; text-align:center; font-size:15px; flex:none}
  .dep .nm{font-size:13.5px; color:var(--muted); flex:1}
  .dep .v{font-family:var(--mono); font-size:13.5px; color:var(--chalk); white-space:nowrap}
  .dep .v b{color:var(--fig-load); font-weight:600}
  .semtot{display:flex; gap:8px; margin-top:11px}
  .semtot div{flex:1; background:var(--surface2); border-radius:10px; padding:8px 10px}
  .semtot .k{font-family:var(--mono); font-size:9.5px; color:var(--faint); letter-spacing:.08em; text-transform:uppercase}
  .semtot .v{font-family:var(--mono); font-size:16px; color:var(--chalk); margin-top:2px}

  .ver{font-family:var(--mono); font-size:10px; color:var(--faint); opacity:.7}
  .nuevaver{position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:120;
    background:var(--chalk); color:#101214; border-radius:14px; padding:11px 13px; display:flex; align-items:center;
    gap:10px; box-shadow:0 8px 24px rgba(0,0,0,.45); font-size:13.5px; font-weight:600}
  .nuevaver button{margin-left:auto; border:none; background:#101214; color:var(--chalk); border-radius:9px;
    padding:8px 13px; font-size:13px; font-weight:600; cursor:pointer}
  .nutri{margin-top:10px; background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:10px 11px}
  .nuh{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--muted); margin-bottom:8px}
  .bidbt{border:1px solid var(--line); background:var(--surface); color:var(--faint); border-radius:999px;
    padding:3px 9px; font-size:11px; font-family:var(--mono); cursor:pointer}
  .nur{display:flex; gap:7px; align-items:stretch}
  .nur .fld{flex:1; background:var(--surface); min-width:0}
  .nur .fld input{font-size:16px; padding:9px 0}
  .nuok{flex:none; border:none; background:var(--chalk); color:#101214; border-radius:10px; padding:0 14px;
    font-size:13px; font-weight:600; cursor:pointer}
  .nuok.ok{background:#5FBF7A}
  .nut{margin-top:8px; font-family:var(--mono); font-size:13px; color:var(--muted)}
  .nut b{color:var(--chalk)}
  .nut .gh{color:var(--fig-load)}
  .nut .vacio{font-family:-apple-system,sans-serif; font-size:12.5px; color:var(--faint)}
  .apav{margin-top:6px; font-size:12px; color:var(--faint); line-height:1.45}
  .appses{margin-top:10px; background:#1F2A22; border:1px solid #2E4A36; border-radius:11px; padding:9px 11px}
  .apph{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12.5px; color:#8FD3A4}
  .apph .n{font-family:var(--mono); font-size:11px; color:var(--faint); white-space:nowrap}
  .apbtn{margin-top:7px; border:none; background:transparent; color:#8FD3A4; font-family:var(--mono);
    font-size:12.5px; padding:2px 0; cursor:pointer}
  .apl{display:none; margin-top:6px}
  .apl.on{display:block}
  .apr{display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-top:1px solid #2E4A36; font-size:13px}
  .apr .an{color:var(--muted); min-width:0}
  .apr .av{font-family:var(--mono); color:var(--chalk); text-align:right}
  .dep .v small{display:block; text-align:right; font-size:11.5px; color:var(--muted); margin-top:1px}
  .lapbtn{margin-top:10px; width:100%; border:1px solid var(--line); background:var(--surface2); color:var(--muted);
    border-radius:10px; padding:9px; font-size:13px; font-family:var(--mono); cursor:pointer}
  .laps{margin-top:8px; display:none}
  .laps.on{display:block}
  .laph, .lapr{display:grid; gap:6px; padding:5px 2px; font-family:var(--mono); font-size:12.5px}
  .laph{color:var(--faint); font-size:10px; letter-spacing:.08em; text-transform:uppercase; border-bottom:1px solid var(--line)}
  .lapr{border-top:1px solid var(--line)}
  .lapr .d{color:var(--chalk)}
  .lapr.rec{opacity:.55}
  .lapr .dest{color:var(--fig-load)}
  .lapr .et{color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  .amap{margin-top:10px; background:var(--surface2); border-radius:11px; padding:6px; cursor:pointer; position:relative}
  .amap .lupa{position:absolute; right:9px; bottom:7px; font-size:11px; color:var(--faint);
    font-family:var(--mono); background:rgba(21,23,26,.75); border-radius:7px; padding:2px 7px}
  .amap:active{opacity:.75}
  .ovl{position:fixed; inset:0; z-index:100; background:var(--bg); display:none; flex-direction:column}
  .ovl.on{display:flex}
  .ovlbar{display:flex; align-items:center; gap:10px; padding:calc(9px + env(safe-area-inset-top)) 13px 9px;
    border-bottom:1px solid var(--line)}
  .ovlbar .t{flex:1; min-width:0}
  .ovlbar .n{font-family:var(--disp); font-size:16px; font-weight:600; letter-spacing:.03em;
    text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block}
  .ovlbar .s{font-family:var(--mono); font-size:11.5px; color:var(--faint); display:block; margin-top:2px}
  .ovlbar button, .ovlbar a{border:1px solid var(--line); background:var(--surface); color:var(--muted);
    border-radius:9px; padding:8px 11px; font-size:13px; cursor:pointer; flex:none; text-decoration:none}
  #mapBox{flex:1; min-height:200px; background:var(--surface2)}
  #mapBox .leaflet-container{width:100%; height:100%; background:var(--surface2)}
  .ovlsvg{padding:14px}
  .ovlsvg svg{width:100%; height:auto}
  .ovlsvg .ruta{fill:none; stroke:var(--fig-load); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
  .ovlsvg .ini{fill:#5FBF7A}
  .ovlsvg .fin{fill:#E2452E}
  .ovlnota{color:var(--faint); font-size:12.5px; text-align:center; padding:0 20px 14px; line-height:1.5}
  .amap svg{display:block; width:100%; height:auto}
  .amap.real{padding:0; overflow:hidden; background:#2A2F36}
  .amap.real svg{aspect-ratio:320/170}
  .amap.real .ruta{stroke:#FF7A1A; stroke-width:3.4}
  .amap.real .sombra{fill:none; stroke:rgba(20,20,20,.55); stroke-width:6.5; stroke-linecap:round; stroke-linejoin:round}
  .amap.real .ini, .amap.real .fin{stroke:#fff; stroke-width:2}
  .amap.real .lupa{background:rgba(21,23,26,.8); color:#C9CEDA}
  .amap .attr{position:absolute; left:5px; bottom:4px; font-size:7px; line-height:1.3; color:rgba(50,50,50,.7);
    background:rgba(255,255,255,.4); border-radius:3px; padding:0 3px; font-family:-apple-system,sans-serif; pointer-events:none}
  .amap .ruta{fill:none; stroke:var(--fig-load); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
  .amap .ini{fill:#5FBF7A}

  .pcard{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:13px; margin-bottom:11px}

  .fnum{font-family:var(--disp); font-size:46px; font-weight:600; line-height:1; min-width:84px; text-align:center}

  .fnota{margin-top:10px; font-size:12.5px; color:#E8B00F; line-height:1.45}

  .kpis.cuatro{grid-template-columns:repeat(2,1fr); margin-top:0}

  .kpis .v small{font-size:11px; color:var(--faint)}

  .ley2{display:flex; align-items:center; gap:4px; justify-content:center; font-size:11px; color:var(--faint)}

/* ================= almacenamiento ================= */
const KEY = "fuerza-log-v3";
const store = {
  backend:null, mem:{},
  localOk(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }catch(e){ return false; } },
  warn(){ document.getElementById("memwarn").style.display = this.backend === "mem" ? "block" : "none"; },
  async init(){
    if (typeof window.storage !== "undefined" && window.storage && window.storage.get) this.backend = "claude";
    else if (this.localOk()) this.backend = "local";
    else this.backend = "mem";
    this.warn();
  },
  async load(){
    try{
      let v = null;
      if (this.backend === "claude"){ const r = await window.storage.get(KEY); v = r && r.value ? r.value : null; }
      else if (this.backend === "local") v = localStorage.getItem(KEY);
      else v = this.mem[KEY] || null;
      return v ? JSON.parse(v) : null;
    }catch(e){ return null; }
  },
  async save(val){
    const s = JSON.stringify(val);
    const backs = [this.backend].concat(["claude","local","mem"].filter(b => b !== this.backend));
    for (const b of backs){
      try{
        if (b === "claude"){ if (!(typeof window.storage !== "undefined" && window.storage && window.storage.set)) continue; await window.storage.set(KEY, s); }
        else if (b === "local"){ if (!this.localOk()) continue; localStorage.setItem(KEY, s); }
        else this.mem[KEY] = s;
        if (b !== this.backend){ this.backend = b; this.warn(); }
        return b === "mem" ? "mem" : "ok";
      }catch(e){}
    }
    return "err";
  }
};

  const dias = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

function refrescarHoy(){
  const h = isoLocal(new Date());
  if (h === TODAY) return false;
  const anterior = TODAY;

  // sesiones empezadas otro día y aún vacías: que tomen la fecha nueva
  Object.keys(data.cur || {}).forEach(k => { const s = data.cur[k]; if (s && s.date === anterior) s.date = TODAY; });

/* ================= utilidades ================= */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtSets(sets){
  return sets.filter(s => s.w !== "" || s.r !== "")
    .map(s => (s.w !== "" ? s.w : "—") + "×" + (s.r !== "" ? s.r : "—")).join(" · ");
}
function fmtDate(iso){
  const p = iso.split("-");
  const m = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return parseInt(p[2],10) + " " + m[parseInt(p[1],10)-1] + (String(new Date().getFullYear()) !== p[0] ? " " + p[0].slice(2) : "");
}
function pastSessions(dayId, exId){
  const arr = (data.hist[dayId] || [])
    .map((s,i) => ({ date:s.date, i:i, e:(s.ex || {})[exId] }))
    .filter(x => exHasData(x.e));
  arr.sort((a,b) => a.date < b.date ? 1 : (a.date > b.date ? -1 : b.i - a.i));
  return arr;
}
function bestSet(sets){
  let best = null;
  sets.forEach(s => {
    const w = num(s.w);
    if (w !== null && (best === null || w > best.w)) best = { w:w, r:s.r };
  });
  return best;
}

/* ---- nutrición por actividad ---- */
const BIDONES = [0.5, 0.6, 0.75, 1];
function litroBidon(){ return data.bidon || 0.75; }
function nutriDe(id){ return (data.nutri || {})[id] || {}; }
function bloqueNutri(a){
  const dep = deporteDe(a.t);
  if (dep === "fuerza" || dep === "nadar" || a.app) return "";
  const n = nutriDe(a.id);
  const hc = n.hc != null ? n.hc : "", bd = n.bid != null ? n.bid : "";
  let x = '<div class="nutri" data-id="' + esc(a.id) + '">';
  x += '<div class="nuh"><span>🥤 Avituallamiento</span><button class="bidbt">' + String(litroBidon()).replace(".", ",") + ' L/bidón</button></div>';
  x += '<div class="nur">';
  x += '<div class="fld"><input type="text" inputmode="numeric" data-f="hc" placeholder="hidratos" value="' + esc(hc) + '"><span class="unit">g</span></div>';
  x += '<div class="fld"><input type="text" inputmode="decimal" data-f="bid" placeholder="bidones" value="' + esc(bd) + '"><span class="unit">ud</span></div>';
  x += '<button class="nuok">Guardar</button></div>';
  x += '<div class="nut"></div></div>';
  return x;
}
function pintarNutri(el, a){
  const n = nutriDe(a.id), t = el.querySelector(".nut");
  const hc = num(n.hc), bd = num(n.bid);
  if (hc == null && bd == null){ t.innerHTML = '<span class="vacio">Apunta lo que has tomado y tócale a guardar.</span>'; return; }
  const l = bd != null ? bd * litroBidon() : null;
  const gh = (hc != null && a.s) ? Math.round(hc / (a.s / 3600)) : null;
  t.innerHTML = 'Total: ' + (hc != null ? '<b>' + f1(hc) + ' g</b>' : '') +
    (hc != null && l != null ? ' · ' : '') + (l != null ? '<b>' + f1(l) + ' L</b>' : '') +
    (gh ? ' <span class="gh">' + gh + ' g/h</span>' : '');
}
function engancharNutri(c, a){
  const el = c.querySelector(".nutri");
  if (!el) return;
  pintarNutri(el, a);
  el.querySelector(".bidbt").onclick = () => {
    const i = BIDONES.indexOf(litroBidon());
    data.bidon = BIDONES[(i + 1) % BIDONES.length];
    scheduleSave(); renderActividades();
  };
  el.querySelector(".nuok").onclick = () => {
    if (!data.nutri) data.nutri = {};
    const v = k => { const s = el.querySelector('input[data-f="' + k + '"]').value.trim(); return s === "" ? null : num(s); };
    const hc = v("hc"), bd = v("bid");
    if (hc == null && bd == null) delete data.nutri[a.id];
    else data.nutri[a.id] = { hc:hc, bid:bd };
    scheduleSave(); pintarNutri(el, a);
    const b = el.querySelector(".nuok");
    b.textContent = "✓ Guardado"; b.classList.add("ok");
    setTimeout(() => { b.textContent = "Guardar"; b.classList.remove("ok"); }, 1600);
  };
}

/* ---- mini mapa con fondo de mapa real (teselas OpenStreetMap / CARTO) ---- */
const TESELA = (z, x, y) => "https://" + "abcd"[(x + y) % 4] + ".basemaps.cartocdn.com/rastertiles/voyager/" + z + "/" + x + "/" + y + "@2x.png";
function merc(lat, lon, z){
  const n = 256 * Math.pow(2, z);
  const s = Math.sin(lat * Math.PI / 180);
  return [ (lon + 180) / 360 * n, (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n ];
}
function mapaMini(g){
  if (!g || g.length < 5) return "";
  const W = 320, H = 170, pad = 22;
  // zoom máximo con el que el recorrido cabe en el recuadro
  let z = 17, P;
  for (; z >= 3; z--){
    P = g.map(p => merc(p[0], p[1], z));
    const xs = P.map(p => p[0]), ys = P.map(p => p[1]);
    if (Math.max.apply(null, xs) - Math.min.apply(null, xs) <= W - 2*pad &&
        Math.max.apply(null, ys) - Math.min.apply(null, ys) <= H - 2*pad) break;
  }
  const xs = P.map(p => p[0]), ys = P.map(p => p[1]);
  const cx = (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2;
  const cy = (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2;
  const ox = cx - W / 2, oy = cy - H / 2;
  // teselas que cubren el recuadro (se cargan al entrar en pantalla)
  let t = "";
  const n = Math.pow(2, z);
  for (let ty = Math.floor(oy / 256); ty <= Math.floor((oy + H) / 256); ty++){
    if (ty < 0 || ty >= n) continue;
    for (let tx = Math.floor(ox / 256); tx <= Math.floor((ox + W) / 256); tx++){
      const txw = ((tx % n) + n) % n;
      t += '<image data-href="' + TESELA(z, txw, ty) + '" x="' + (tx*256 - ox).toFixed(1) + '" y="' + (ty*256 - oy).toFixed(1) +
           '" width="256.6" height="256.6" preserveAspectRatio="none"/>';
    }
  }
  const pts = P.map(p => [(p[0] - ox).toFixed(1), (p[1] - oy).toFixed(1)]);
  const d = "M" + pts.map(p => p[0] + " " + p[1]).join(" L");
  const a = pts[0], b = pts[pts.length - 1];
  return '<div class="amap real"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
    '<g class="teselas">' + t + '</g>' +
    '<path class="sombra" d="' + d + '"/><path class="ruta" d="' + d + '"/>' +
    '<circle class="ini" cx="' + a[0] + '" cy="' + a[1] + '" r="5"/>' +
    '<circle class="fin" cx="' + b[0] + '" cy="' + b[1] + '" r="5"/></svg>' +
    '<span class="attr">© OSM · CARTO</span><span class="lupa">toca para ampliar</span></div>';
}
// cargar las teselas solo cuando el mapa se ve
const vigiaMapas = ("IntersectionObserver" in window) ? new IntersectionObserver(ents => {
  ents.forEach(en => {
    if (!en.isIntersecting) return;
    cargarTeselas(en.target);
    vigiaMapas.unobserve(en.target);
  });
}, { rootMargin:"300px 0px" }) : null;
function cargarTeselas(el){
  el.querySelectorAll("image[data-href]").forEach(im => {
    const u = im.getAttribute("data-href");
    im.setAttribute("href", u);
    im.setAttributeNS("http://www.w3.org/1999/xlink", "xlink:href", u);
    im.removeAttribute("data-href");
  });
}
function vigilarMapas(raiz){
  raiz.querySelectorAll(".amap.real").forEach(el => { if (vigiaMapas) vigiaMapas.observe(el); else cargarTeselas(el); });
}

function mapaSVG(g, grande){
  if (!g || g.length < 5) return "";
  const latM = g.reduce((a,p) => a + p[0], 0) / g.length;
  const k = Math.cos(latM * Math.PI / 180);
  const xs = g.map(p => p[1] * k), ys = g.map(p => -p[0]);
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  const y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  const w = Math.max(x1-x0, 1e-6), hh = Math.max(y1-y0, 1e-6);
  const W = 300, H = grande ? 260 : 120, pad = 10;
  const esc2 = Math.min((W-2*pad)/w, (H-2*pad)/hh);
  const dx = (W - w*esc2)/2 - x0*esc2, dy = (H - hh*esc2)/2 - y0*esc2;
  const pts = g.map(p => [((p[1]*k)*esc2+dx).toFixed(1), ((-p[0])*esc2+dy).toFixed(1)]);
  const d = "M" + pts.map(p => p[0] + " " + p[1]).join(" L");
  const a = pts[0], b = pts[pts.length-1];
  const svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">' +
    '<path class="ruta" d="' + d + '"/>' +
    '<circle class="ini" cx="' + a[0] + '" cy="' + a[1] + '" r="4"/>' +
    '<circle class="fin" cx="' + b[0] + '" cy="' + b[1] + '" r="4"/></svg>';
  if (grande) return svg;
  return '<div class="amap">' + svg + '<span class="lupa">toca para ampliar</span></div>';
}

/* ---- mapa a pantalla completa ---- */
let leafletCargando = null, mapa = null;
function cargarLeaflet(){
  if (window.L) return Promise.resolve(true);
  if (leafletCargando) return leafletCargando;
  leafletCargando = new Promise(resolve => {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
    document.head.appendChild(css);
    const js = document.createElement("script");
    js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    js.onload = () => resolve(true);
    js.onerror = () => resolve(false);
    document.head.appendChild(js);
    setTimeout(() => resolve(!!window.L), 6000);
  });
  return leafletCargando;
}

function cerrarMapa(){
  document.getElementById("mapOv").classList.remove("on");
  if (mapa){ try{ mapa.remove(); }catch(e){} mapa = null; }
  document.getElementById("mapBox").innerHTML = "";
}

async function abrirMapa(a){
  if (!a.g || a.g.length < 5) return;
  const ov = document.getElementById("mapOv");
  document.getElementById("ovlName").textContent = a.n || tipoEs(a.t) || "Actividad";
  const det = [fmtDate(a.d), fmtHora(a.dt), fmtKm(a.km), fmtDur(a.s), fmtRitmo(a.t, a.km, a.s)]
    .filter(Boolean).join(" · ");
  document.getElementById("ovlSub").textContent = det;
  const link = document.getElementById("ovlLink");
  if (a.id){ link.href = "https://intervals.icu/activities/" + a.id; link.style.display = ""; }
  else link.style.display = "none";
  const box = document.getElementById("mapBox");
  box.innerHTML = '<div class="ovlnota" style="padding-top:22px">cargando mapa…</div>';
  ov.classList.add("on");

  const ok = await cargarLeaflet();
  if (!ov.classList.contains("on")) return;
  if (!ok || !window.L){
    box.innerHTML = '<div class="ovlsvg">' + mapaSVG(a.g, true) + '</div>' +
      '<div class="ovlnota">Sin conexión para el mapa de calles.<br>Este es el trazado de tu recorrido.</div>';
    return;
  }
  box.innerHTML = "";
  try{
    mapa = L.map(box, { zoomControl:true, attributionControl:true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      { maxZoom:18, attribution:"© OpenStreetMap" }).addTo(mapa);
    const linea = L.polyline(a.g, { color:"#FFA84D", weight:4, opacity:.95 }).addTo(mapa);
    L.circleMarker(a.g[0], { radius:6, color:"#5FBF7A", fillColor:"#5FBF7A", fillOpacity:1, weight:2 }).addTo(mapa);
    L.circleMarker(a.g[a.g.length-1], { radius:6, color:"#E2452E", fillColor:"#E2452E", fillOpacity:1, weight:2 }).addTo(mapa);
    mapa.fitBounds(linea.getBounds(), { padding:[24,24] });
    setTimeout(() => { if (mapa) mapa.invalidateSize(); }, 200);
  }catch(e){
    box.innerHTML = '<div class="ovlsvg">' + mapaSVG(a.g, true) + '</div>' +
      '<div class="ovlnota">No se pudo cargar el mapa.<br>Este es el trazado de tu recorrido.</div>';
  }
}

async function loadRuns(){
  try{
    const r = await fetch("runs.json?t=" + Date.now(), { cache:"no-store" });
    if (!r.ok) return false;
    const j = await r.json();
    if (!j || !Array.isArray(j.activities)) return false;
    data.runs = j.activities; data.runsUp = j.updated || null;
    scheduleSave();
    if (section === "act") renderActividades();
    return true;
  }catch(e){ return false; }
}

function fmtSerie(s){
  if (!s) return "—";
  const hh = Math.floor(s/3600), mm = Math.floor((s%3600)/60), ss = Math.round(s%60);
  if (hh) return hh + ":" + String(mm).padStart(2,"0") + ":" + String(ss).padStart(2,"0");
  return mm + ":" + String(ss).padStart(2,"0");
}
function tablaSeries(a){
  const lp = a.lp;
  if (!lp || !lp.length) return "";
  const dep = deporteDe(a.t);
  let cols, cabe, fila;

  if (dep === "correr" || dep === "trail" || dep === "montana"){
    cols = "1fr 62px 62px 68px";
    cabe = ["lap","dist","tiempo","ritmo"];
    fila = s => [s.km ? (Math.round(s.km*100)/100).toString().replace(".", ",") + " km" : "—",
                 fmtSerie(s.s),
                 s.km && s.s ? fmtRitmo("Run", s.km, s.s) : "—"];
  } else if (dep === "btt"){
    cols = "1fr 62px 62px 58px";
    cabe = ["lap","dist","tiempo","ppm"];
    fila = s => [s.km ? (Math.round(s.km*100)/100).toString().replace(".", ",") + " km" : "—",
                 fmtSerie(s.s), s.hr ? s.hr : "—"];
  } else if (dep === "bici"){
    cols = "1fr 62px 58px 58px";
    cabe = ["lap","tiempo","np","ppm"];
    fila = s => [fmtSerie(s.s), s.w ? s.w + " W" : "—", s.hr ? s.hr : "—"];
  } else if (dep === "nadar"){
    cols = "1fr 62px 62px 76px";
    cabe = ["lap","dist","tiempo","ritmo"];
    fila = s => [s.km ? Math.round(s.km*1000) + " m" : "—",
                 fmtSerie(s.s),
                 s.km && s.s ? fmtRitmo("Swim", s.km, s.s) : "—"];
  } else {
    cols = "1fr 80px";
    cabe = ["lap","tiempo"];
    fila = s => [fmtSerie(s.s)];
  }

  let h = '<button class="lapbtn">▸ ver laps (' + lp.length + ')</button><div class="laps">';
  h += '<div class="laph" style="grid-template-columns:' + cols + '">' +
       cabe.map(c => '<span>' + c + '</span>').join("") + '</div>';
  lp.forEach(s => {
    const v = fila(s);
    h += '<div class="lapr' + (s.tp === "RECO" ? " rec" : "") + '" style="grid-template-columns:' + cols + '">';
    h += '<span class="et">' + esc(s.n) + '</span>';
    v.forEach((val,i) => {
      h += '<span class="d' + (i === v.length-1 ? " dest" : "") + '">' + esc(val) + '</span>';
    });
    h += '</div>';
  });
  h += '</div>';
  return h;
}

/* ================= vista: actividades por día ================= */
function renderActividades(){
  document.documentElement.style.setProperty("--accent", "#FFA84D");
  const cont = document.getElementById("content");
  cont.className = "";
  cont.innerHTML = "";

  const sync = document.createElement("div");
  sync.className = "sync";
  const n = (data.runs || []).length;
  sync.innerHTML = '<span>' + (n ? n + " actividades" + (data.runsUp ? " · " + fmtDate(String(data.runsUp).slice(0,10)) : "")
                                 : "sin actividades sincronizadas") + '</span>';
  const rb = document.createElement("button");
  rb.textContent = "↻ actualizar";
  rb.onclick = async () => {
    rb.textContent = "…";
    const ok = await loadRuns();
    if (ok) renderActividades();
    else { rb.textContent = "no disponible"; setTimeout(() => { rb.textContent = "↻ actualizar"; }, 2000); }
  };
  sync.appendChild(rb);
  cont.appendChild(sync);

  const enl = enlazarFuerza();
  const acts = actividadesTodas().sort((a,b) => (a.dt || a.d) < (b.dt || b.d) ? 1 : -1);
  if (!acts.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = 'Aquí aparecerán tus carreras y salidas,<br>día a día, con ritmo, tiempo y recorrido.';
    cont.appendChild(e);
    return;
  }

  let diaActual = null;
  acts.forEach(a => {
    if (a.d !== diaActual){
      diaActual = a.d;
      const delDia = acts.filter(x => x.d === a.d);
      const km = delDia.reduce((s,x) => s + (x.km || 0), 0);
      const seg = delDia.reduce((s,x) => s + (x.s || 0), 0);
      const hd = document.createElement("div");
      hd.className = "diahead";
      hd.innerHTML = '<span class="f">' + (a.d === TODAY ? "Hoy" : nomDia(a.d) + " " + fmtDate(a.d)) + '</span>' +
        '<span class="tot">' + [km ? fmtKm(km) : "", seg ? fmtDurS(seg) : ""].filter(Boolean).join(" · ") + '</span>';
      cont.appendChild(hd);
    }

    const c = document.createElement("div");
    c.className = "acard";
    const tEf = (enl.porAct[a.id] && a.t !== "WeightTraining") ? "WeightTraining" : a.t;
    let x = '<div class="ahead"><span class="aico">' + icono(tEf) + '</span>';
    x += '<span class="atit"><span class="aname">' + esc(a.n || a.t || "Actividad") + '</span>';
    x += '<span class="ahora">' + [fmtHora(a.dt), tipoEs(tEf)].filter(Boolean).join(" · ") + '</span></span></div>';

    const stats = [];
    const dep = deporteDe(tEf);
    const km = a.km ? ["distancia", fmtKm(a.km), true] : null;
    const tiempo = a.s ? ["tiempo", fmtDurS(a.s), false] : null;
    const pulso = a.hr ? ["pulso medio", Math.round(a.hr) + " ppm", false] : null;
    const subida = a.up ? ["desnivel", Math.round(a.up) + " m+", false] : null;
    const ritmo = fmtRitmo(a.t, a.km, a.s);

    if (dep === "trail" || dep === "montana"){
      if (tiempo) stats.push(tiempo);
      if (a.up) stats.push(["desnivel +", Math.round(a.up) + " m", true]);
      if (ritmo) stats.push(["ritmo", ritmo, true]);
      if (pulso) stats.push(pulso);
      if (km) stats.push(["distancia", fmtKm(a.km), false]);
    } else if (dep === "btt"){
      if (km) stats.push(km);
      if (ritmo) stats.push(["velocidad media", ritmo, true]);
      if (tiempo) stats.push(tiempo);
      if (a.up) stats.push(["desnivel +", Math.round(a.up) + " m", false]);
      if (pulso) stats.push(pulso);
      if (a.st) stats.push(["tiempo total", fmtDurS(a.st), false]);
    } else if (dep === "correr"){
      if (km) stats.push(km);
      if (tiempo) stats.push(tiempo);
      if (ritmo) stats.push(["ritmo", ritmo, true]);
      if (pulso) stats.push(pulso);
      if (subida) stats.push(subida);
    } else if (dep === "bici"){
      if (km) stats.push(km);
      if (tiempo) stats.push(tiempo);
      stats.push(["np", a.np ? Math.round(a.np) + " W" : "—", true]);
      if (a.pw) stats.push(["potencia media", Math.round(a.pw) + " W", false]);
      if (pulso) stats.push(pulso);
      if (ritmo) stats.push(["velocidad", ritmo, false]);
      if (subida) stats.push(subida);
    } else if (dep === "nadar"){
      if (a.km) stats.push(["distancia", a.km < 3 ? Math.round(a.km*1000) + " m" : fmtKm(a.km), true]);
      if (tiempo) stats.push(tiempo);
      if (ritmo) stats.push(["ritmo", ritmo, true]);
      if (pulso) stats.push(pulso);
    } else if (dep === "fuerza"){
      if (tiempo) stats.push(tiempo);
      if (pulso) stats.push(pulso);
    } else if (a.t === "Other" && enl.porAct[a.id]){
      if (tiempo) stats.push(tiempo);
      if (pulso) stats.push(pulso);
    } else {
      if (km) stats.push(km);
      if (tiempo) stats.push(tiempo);
      if (ritmo) stats.push(["ritmo", ritmo, true]);
      if (pulso) stats.push(pulso);
      if (subida) stats.push(subida);
    }
    if (stats.length){
      x += '<div class="astats">';
      stats.forEach(s => {
        x += '<div class="stat' + (s[2] ? " dest" : "") + '"><div class="k">' + s[0] + '</div><div class="v">' + esc(s[1]) + '</div></div>';
      });
      x += '</div>';
    }
    x += bloqueApp(a.app || enl.porAct[a.id], !!a.sinAct);
    x += mapaMini(a.g);
    x += bloqueNutri(a);
    x += tablaSeries(a);
    c.innerHTML = x;
    const ab = c.querySelector(".apbtn");
    if (ab) ab.onclick = () => {
      const l = c.querySelector(".apl");
      const on = l.classList.toggle("on");
      ab.textContent = on ? "▾ ocultar ejercicios" : "▸ ver ejercicios";
    };
    const m = c.querySelector(".amap");
    if (m){ m.onclick = () => abrirMapa(a); vigilarMapas(c); }
    engancharNutri(c, a);
    const lb = c.querySelector(".lapbtn");
    if (lb) lb.onclick = () => {
      const t = c.querySelector(".laps");
      const ab = t.classList.toggle("on");
      lb.textContent = (ab ? "▾ ocultar laps" : "▸ ver laps (" + a.lp.length + ")");
    };
    cont.appendChild(c);
  });
}

/* ================= vista: resumen por semanas ================= */
function renderSemanas(){
  document.documentElement.style.setProperty("--accent", "#FFA84D");
  const cont = document.getElementById("content");
  cont.className = "";
  cont.innerHTML = "";

  const acts = actividadesTodas();
  const enl = enlazarFuerza();
  if (!acts.length){
    cont.innerHTML = '<div class="empty">Aquí verás el resumen de cada semana<br>por deporte, horas y kilómetros.</div>';
    return;
  }

  const semanas = {};
  acts.forEach(a => {
    if (!a.d) return;
    const L = lunesDe(a.d);
    if (!semanas[L]) semanas[L] = { seg:0, ses:0, dep:{} };
    const S = semanas[L];
    const k = enl.porAct[a.id] ? "fuerza" : deporteDe(a.t);
    if (!S.dep[k]) S.dep[k] = { seg:0, km:0, ses:0, up:0 };
    S.dep[k].seg += a.s || 0;
    S.dep[k].km += a.km || 0;
    S.dep[k].up += a.up || 0;
    S.dep[k].ses += 1;
    S.seg += a.s || 0;
    S.ses += 1;
  });

  const lunesHoy = lunesDe(TODAY);
  Object.keys(semanas).sort().reverse().slice(0, 26).forEach(L => {
    const S = semanas[L];
    const p = L.split("-");
    const ini = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
    const fin = new Date(ini); fin.setDate(fin.getDate() + 6);
    const viva = L === lunesHoy;

    const c = document.createElement("div");
    c.className = "sem" + (viva ? " viva" : "");

async function loadPlan(){
  try{
    const r = await fetch("plan.json?t=" + Date.now(), { cache:"no-store" });
    if (!r.ok) return false;
    const j = await r.json();
    if (!j || !Array.isArray(j.events)) return false;
    data.planEv = j.events; data.planUp = j.updated || null;
    scheduleSave();
    if (section === "cal") renderCalendario();
    return true;
  }catch(e){ return false; }
}
function sumaDias(iso, n){
  const p = iso.split("-");
  const d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10) + n);
  return isoLocal(d);
}
const MESES_L = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function eventosDe(iso){ return (data.planEv || []).filter(e => e.d === iso); }
/* ---- sesiones de fuerza de la app ---- */
function sesionesApp(){
  const out = [];
  PLAN.forEach(day => {
    const names = {}; allEx(day.id).forEach(e => names[e.id] = e.n);
    (data.hist[day.id] || []).forEach((s, i) => {
      if (!s || !s.date) return;
      const items = [];
      Object.keys(s.ex || {}).forEach(id => {
        const e = s.ex[id];
        const nom = names[id] || LEGACY[id] || "Ejercicio";
        if (exHasData(e)) items.push({ n:nom, v:fmtSets(e.sets) });
        else if (e && e.done) items.push({ n:nom, v:"✓" });
      });
      if (!items.length && !s.mob) return;
      out.push({ key:day.id + ":" + i, day:day, s:s, d:s.date, items:items, dur:s.dur || null, fin:s.fin || null });
    });
  });
  return out;
}
function esFuerzaIntervals(t){ return deporteDe(t) === "fuerza" || t === "Other" || !t; }
function enlazarFuerza(){
  const ses = sesionesApp();
  const porFecha = {}, porAct = {}, sueltas = [];
  ses.forEach(s => { (porFecha[s.d] = porFecha[s.d] || []).push(s); });
  Object.keys(porFecha).forEach(d => {
    const cand = (data.runs || []).filter(a => a.d === d && esFuerzaIntervals(a.t))
      .sort((x, y) => (x.dt || "") < (y.dt || "") ? -1 : 1);
    porFecha[d].forEach((s, i) => { if (cand[i]) porAct[cand[i].id] = s; else sueltas.push(s); });
  });
  return { porAct:porAct, sueltas:sueltas };
}
function horaDe(ms){
  const d = new Date(ms);
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
// actividades de Intervals + sesiones de la app que no tienen actividad propia
function actividadesTodas(){
  const { sueltas } = enlazarFuerza();
  const extra = sueltas.map(s => ({
    id:"app:" + s.key, d:s.d, dt: s.fin ? s.d + "T" + horaDe(s.fin) + ":00" : s.d,
    t:"WeightTraining", n:"Fuerza · " + (s.day.dia || "") + (s.day.scheme ? " (" + s.day.scheme + ")" : ""),
    s:null, app:s, sinAct:true
  }));
  return (data.runs || []).concat(extra);
}

function familia(t){

function hechoEn(e){

function renderCalendario(){
  document.documentElement.style.setProperty("--accent", "#FFA84D");
  const cont = document.getElementById("content");
  cont.className = "";
  cont.innerHTML = "";
  if (!calRef) calRef = TODAY;
  if (!calSel) calSel = TODAY;

  // modo semana / mes + volver a hoy
  const modo = document.createElement("div");
  modo.className = "calmodo";
  modo.innerHTML = '<button data-m="semana" class="' + (calModo === "semana" ? "on" : "") + '">Semana</button>' +
                   '<button data-m="mes" class="' + (calModo === "mes" ? "on" : "") + '">Mes</button>' +
                   '<button class="hoy">Hoy</button>';
  modo.querySelectorAll("[data-m]").forEach(bt => bt.onclick = () => { calModo = bt.dataset.m; renderCalendario(); });
  modo.querySelector(".hoy").onclick = () => {
    refrescarHoy();
    calRef = TODAY; calSel = TODAY;
    renderCalendario();
    const obj = document.querySelector(calModo === "semana" ? ".cday.hoy" : ".mgrid ~ .cday");
    if (obj){
      const off = document.querySelector("header").offsetHeight + 12;
      window.scrollTo({ top: obj.getBoundingClientRect().top + window.scrollY - off, behavior:"smooth" });
      obj.classList.add("flash");
      setTimeout(() => obj.classList.remove("flash"), 1400);
    }
  };
  cont.appendChild(modo);

  // barra de navegación
  const bar = document.createElement("div");
  bar.className = "calbar";
  let titulo;
  if (calModo === "semana"){
    const L = lunesDe(calRef), V = sumaDias(L, 4);
    titulo = (L === lunesDe(TODAY)) ? "Esta semana" : fmtDate(L) + " – " + fmtDate(V);
  } else {
    const p = calRef.split("-");
    titulo = MESES_L[parseInt(p[1],10)-1] + " " + p[0];
  }
  bar.innerHTML = '<button class="nav" data-d="-1">‹</button><span class="tit">' + esc(titulo) + '</span><button class="nav" data-d="1">›</button>';
  bar.querySelectorAll(".nav").forEach(bt => bt.onclick = () => {
    const d = parseInt(bt.dataset.d, 10);
    if (calModo === "semana") calRef = sumaDias(lunesDe(calRef), 7 * d);
    else {
      const p = calRef.split("-");
      calRef = isoLocal(new Date(parseInt(p[0],10), parseInt(p[1],10)-1 + d, 1));
      calSel = calRef;
    }
    renderCalendario();
  });
  cont.appendChild(bar);

  if (calModo === "semana"){
    const L = lunesDe(calRef);
    for (let i = 0; i < 7; i++){
      const iso = sumaDias(L, i);
      if (i >= 5 && !eventosDe(iso).length && iso !== TODAY && !(data.notas || {})[iso]) continue;   // finde solo si hay algo
      cont.appendChild(bloqueDia(iso));
    }
  } else {
    const p = calRef.split("-");
    const primero = isoLocal(new Date(parseInt(p[0],10), parseInt(p[1],10)-1, 1));
    const mesActual = primero.slice(0, 7);
    let d = lunesDe(primero);
    const g = document.createElement("div");
    g.className = "mgrid";
    g.innerHTML = ["L","M","X","J","V","S","D"].map(w => '<span class="wd">' + w + '</span>').join("");
    for (let k = 0; k < 42; k++){
      if (k >= 35 && d.slice(0,7) !== mesActual) break;
      const iso = d;
      const evs = eventosDe(iso);
      const cel = document.createElement("div");
      cel.className = "mcel" + (iso.slice(0,7) !== mesActual ? " fuera" : "") +
                      (iso === TODAY ? " hoy" : "") + (iso === calSel ? " sel" : "");
      const ics = evs.slice(0,3).map(iconoEv);
      if ((data.notas || {})[iso]) ics.push("✏️");
      cel.innerHTML = '<span class="n">' + parseInt(iso.slice(8,10),10) + '</span>' +
                      (ics.length ? '<span class="ic">' + ics.join("") + '</span>' : '');
      cel.onclick = () => { calSel = iso; renderCalendario(); };
      g.appendChild(cel);
      d = sumaDias(d, 1);
    }
    cont.appendChild(g);
    cont.appendChild(bloqueDia(calSel));
  }

  // pie: última actualización
  const pie = document.createElement("div");
  pie.className = "calpie";
  const n = (data.planEv || []).length;
  pie.innerHTML = '<span>' + (n ? (data.planUp ? "actualizado " + fmtDate(String(data.planUp).slice(0,10)) + " · " : "") + "se actualiza cada hora"
                                 : "Cuando tu entrenador suba entrenos a Intervals aparecerán aquí") + '</span>';
  const rb = document.createElement("button");
  rb.textContent = "↻";
  rb.onclick = async () => { rb.textContent = "…"; const ok = await loadPlan(); if (!ok) rb.textContent = "↻"; };
  pie.appendChild(rb);
  cont.appendChild(pie);
}

function estadoForma(t){
  if (t > 25)  return { n:"Transición",  c:"#E8B00F", t:"Muy descansado: si sigue así, empezarás a perder forma." };
  if (t > 5)   return { n:"Fresco",      c:"#3B82E0", t:"Descansado: buen momento para competir o para un test." };
  if (t > -10) return { n:"Neutral",     c:"#9BA0A8", t:"Ni cargado ni descansado." };
  if (t > -30) return { n:"Óptimo",      c:"#5FBF7A", t:"Estás cargando bien: así es como se gana forma." };
  return            { n:"Riesgo alto", c:"#E2452E", t:"Mucha fatiga acumulada: vigila el descanso y las molestias." };
}
function vistaForma(cont){

  tarjeta(cont,
    '<div class="fhero"><div class="fnum" style="color:' + e.c + '">' + (tsb > 0 ? "+" : "") + Math.round(tsb) + '</div>' +

    '<div><span class="k">Subida semanal</span><span class="v"' + (u.rr > 8 ? ' style="color:#E8B00F"' : '') + '>' +
      (u.rr != null ? (u.rr > 0 ? "+" : "") + f1(u.rr) : "—") + '</span></div></div>' +
    (u.rr > 8 ? '<div class="fnota">⚠️ Estás subiendo la carga muy deprisa. Más de +8 por semana aumenta el riesgo de lesión.</div>' : ''));

  // bienestar (si tu reloj lo manda a Intervals)
  const rec = dias.slice(-3).reverse();

  const rhr = val("rhr"), hrv = val("hrv"), sue = val("sue");

      (hrv ? '<div><span class="k">VFC</span><span class="v">' + Math.round(hrv) + '<small> ms</small></span></div>' : '') +
      (sue ? '<div><span class="k">Sueño</span><span class="v">' + sumaDur(sue) + '</span></div>' : '') + '</div>');
  }

  // gráfica

    b.onclick = () => { formaRango = r[0]; renderProgreso(); };

  tarjeta(cont, '<div class="expl"><b>Forma física</b>: tu carga media de las últimas 6 semanas. Cuanto más alta, más en forma.<br>' +

}
function graficoForma(s){
  const W = 340, pad = 8, H1 = 120, H2 = 56, gap = 16, top = 8;
  const n = s.length;
  const x = i => pad + (n > 1 ? i * (W - 2*pad) / (n - 1) : (W - 2*pad) / 2);
  const ymax = Math.max(10, Math.max.apply(null, s.map(d => Math.max(d.ctl, d.atl)))) * 1.1;
  const y1 = v => top + H1 - v / ymax * H1;
  const lin = k => "M" + s.map((d,i) => x(i).toFixed(1) + " " + y1(d[k]).toFixed(1)).join(" L");
  const ts = s.map(d => d.ctl - d.atl);
  const tmax = Math.max(25, Math.max.apply(null, ts)), tmin = Math.min(-35, Math.min.apply(null, ts));
  const b0 = top + H1 + gap;
  const y2 = v => b0 + (tmax - v) / (tmax - tmin) * H2;
  const bw = Math.max(0.8, (W - 2*pad) / n * 0.75);
  let bars = "";
  ts.forEach((t, i) => {
    const ya = y2(Math.max(t, 0)), yb = y2(Math.min(t, 0));
    bars += '<rect x="' + (x(i) - bw/2).toFixed(1) + '" y="' + ya.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(0.6, yb - ya).toFixed(1) + '" fill="' + estadoForma(t).c + '"/>';
  });
  const H = b0 + H2 + 16;
  const et = i => '<text x="' + x(i).toFixed(1) + '" y="' + (H - 3) + '" text-anchor="' + (i === 0 ? "start" : i === n-1 ? "end" : "middle") + '">' + fmtDate(s[i].d) + '</text>';
  return '<svg class="gfor" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<line x1="' + pad + '" x2="' + (W-pad) + '" y1="' + y1(0) + '" y2="' + y1(0) + '" class="eje"/>' +
    '<path d="' + lin("ctl") + ' L' + x(n-1).toFixed(1) + ' ' + y1(0) + ' L' + x(0).toFixed(1) + ' ' + y1(0) + ' Z" fill="rgba(59,130,224,.13)"/>' +
    '<path d="' + lin("atl") + '" class="latl"/><path d="' + lin("ctl") + '" class="lctl"/>' +
    '<line x1="' + pad + '" x2="' + (W-pad) + '" y1="' + y2(0) + '" y2="' + y2(0) + '" class="eje"/>' + bars +
    et(0) + (n > 2 ? et(Math.floor((n-1)/2)) : "") + (n > 1 ? et(n-1) : "") + '</svg>';
}

/* ---------- PLAN VS HECHO ---------- */
function colorCumpl(p){ return p >= .9 ? "#5FBF7A" : p >= .6 ? "#E8B00F" : "#E2452E"; }
function vistaPlan(cont){
  const evs = (data.planEv || []).filter(e => e.c === "WORKOUT");
  if (!evs.length){ aviso(cont, "Cuando tu entrenador te planifique en Intervals,<br>aquí verás qué parte cumples cada semana."); return; }
  const todas = actividadesTodas();
  const L0 = lunesDe(TODAY);
  const filas = [];
  for (let k = 0; k < 10; k++){
    const L = sumaDias(L0, -7 * k), D = sumaDias(L, 6);
    const plan = evs.filter(e => e.d >= L && e.d <= D);
    const pasado = plan.filter(e => e.d <= TODAY);
    const hechos = plan.filter(hechoEn);
    const hPlan = plan.reduce((a, e) => a + (e.s || 0), 0);
    const hHecho = todas.filter(a => a.d >= L && a.d <= D).reduce((a, x) => a + (x.s || 0), 0);
    filas.push({ L:L, D:D, plan:plan, pasado:pasado, hechos:hechos, hPlan:hPlan, hHecho:hHecho, actual:k === 0 });
  }
  const cerradas = filas.filter(f => !f.actual && f.plan.length).slice(0, 4);
  if (cerradas.length){
    const media = cerradas.reduce((a, f) => a + f.hechos.length / f.plan.length, 0) / cerradas.length;
    tarjeta(cont, '<div class="fhero"><div class="fnum" style="color:' + colorCumpl(media) + '">' + Math.round(media * 100) + '%</div>' +
      '<div class="ftxt"><span class="fest" style="background:' + colorCumpl(media) + '">Cumplimiento</span>' +
      '<span class="fdes">Media de las últimas ' + cerradas.length + ' semanas con plan: sesiones planificadas que has hecho.</span></div></div>');
  }
  filas.forEach(f => {
    if (!f.plan.length){
      tarjeta(cont, '<div class="plh"><span class="r">' + (f.actual ? "Esta semana" : fmtDate(f.L) + " – " + fmtDate(f.D)) + '</span><span class="sp">sin plan</span></div>', "fina");
      return;
    }
    const base = f.actual ? Math.max(f.pasado.length, f.hechos.length) : f.plan.length;
    const p = base ? f.hechos.length / base : 0;
    const col = f.actual && !base ? "#9BA0A8" : colorCumpl(p);
    const pend = f.actual ? f.plan.length - f.pasado.length : 0;
    tarjeta(cont,
      '<div class="plh"><span class="r">' + (f.actual ? "Esta semana" : fmtDate(f.L) + " – " + fmtDate(f.D)) + '</span>' +
      '<span class="pc" style="color:' + col + '">' + (base ? Math.round(p * 100) + "%" : "—") + '</span></div>' +
      '<div class="barra"><i style="width:' + Math.round(Math.min(1, f.hechos.length / f.plan.length) * 100) + '%;background:' + col + '"></i></div>' +
      '<div class="pld"><span>' + f.hechos.length + ' de ' + f.plan.length + ' sesiones' + (pend > 0 ? ' · ' + pend + ' pendiente' + (pend > 1 ? 's' : '') : '') + '</span>' +
      '<span>' + sumaDur(f.hHecho) + ' de ' + sumaDur(f.hPlan) + '</span></div>', f.actual ? "viva" : "");
  });
}

/* ---------- ZONAS ---------- */
const ZCOL = ["#7C8594", "#3B82E0", "#33A857", "#E8B00F", "#F07F2E", "#E2452E", "#9B3FB5"];
function sumaZonas(acts){
  const z = [];
  acts.forEach(a => (a.zh || []).forEach((s, i) => { z[i] = (z[i] || 0) + (s || 0); }));
  for (let i = 0; i < z.length; i++) z[i] = z[i] || 0;
  return z;
}
function barraZonas(z){
  const tot = z.reduce((a, b) => a + b, 0) || 1;
  return '<div class="zbar">' + z.map((s, i) => s ? '<i style="width:' + (s / tot * 100).toFixed(2) + '%;background:' + ZCOL[i % ZCOL.length] + '"></i>' : '').join("") + '</div>';
}
function vistaZonas(cont){
  const acts = (data.runs || []).filter(a => a.zh && a.zh.length);
  if (!acts.length){ aviso(cont, "Aún no hay datos de zonas de pulso.<br>Llegarán con la próxima actualización desde Intervals."); return; }
  const L0 = lunesDe(TODAY);
  const semana = L => acts.filter(a => a.d >= L && a.d <= sumaDias(L, 6));
  // semana actual (o la última con datos)
  let Lr = L0, zr = sumaZonas(semana(L0));
  for (let k = 1; k < 8 && !zr.reduce((a,b) => a+b, 0); k++){ Lr = sumaDias(L0, -7*k); zr = sumaZonas(semana(Lr)); }
  const tot = zr.reduce((a, b) => a + b, 0);
  if (tot){
    const suave = (zr[0] || 0) + (zr[1] || 0), pS = suave / tot;
    const veredicto = pS >= .75 ? ["Buen reparto: mayoría suave", "#5FBF7A"]
                    : pS >= .6 ? ["Algo de más intensidad", "#E8B00F"] : ["Mucha intensidad", "#E2452E"];
    let x = '<div class="plh"><span class="r">' + (Lr === L0 ? "Esta semana" : fmtDate(Lr) + " – " + fmtDate(sumaDias(Lr, 6))) + '</span><span class="sp">' + sumaDur(tot) + '</span></div>';
    x += barraZonas(zr);
    x += '<div class="z8020"><span>Suave (Z1-Z2) <b>' + Math.round(pS * 100) + '%</b></span><span>Intensidad (Z3+) <b>' + Math.round((1 - pS) * 100) + '%</b></span></div>';
    x += '<div class="zver" style="color:' + veredicto[1] + '">● ' + veredicto[0] + '</div>';
    x += '<div class="zlist">' + zr.map((s, i) => '<div><i style="background:' + ZCOL[i % ZCOL.length] + '"></i><span class="zn">Z' + (i+1) + '</span>' +
         '<span class="zt">' + sumaDur(s) + '</span><span class="zp">' + Math.round(s / tot * 100) + '%</span></div>').join("") + '</div>';
    tarjeta(cont, x, "viva");
  }
  const lst = document.createElement("div");
  lst.className = "zsem";
  let h = '<div class="stit">Semanas anteriores</div>';
  for (let k = 1; k <= 8; k++){
    const L = sumaDias(L0, -7 * k), z = sumaZonas(semana(L)), t = z.reduce((a, b) => a + b, 0);
    h += '<div class="zrow"><span class="zf">' + fmtDate(L) + '</span>' + (t ? barraZonas(z) : '<div class="zbar vacia"></div>') +
         '<span class="zh">' + (t ? sumaDur(t) : "—") + '</span></div>';
  }
  lst.innerHTML = h;
  cont.appendChild(lst);
  tarjeta(cont, '<div class="expl">Tiempo en cada <b>zona de pulso</b> según tus zonas de Intervals. En resistencia, lo habitual es que la mayor parte (≈75-80%) sea suave y el resto intenso.</div>', "suave");
}

/* ---------- RÉCORDS (1RM estimado) ---------- */
function historialFuerza(){
  const mapa = {};
  PLAN.forEach(day => {
    const names = {}; allEx(day.id).forEach(e => names[e.id] = e.n);
    (data.hist[day.id] || []).forEach(s => {
      if (!s || !s.date) return;
      Object.keys(s.ex || {}).forEach(id => {
        let rm = 0, mw = 0;
        ((s.ex[id] || {}).sets || []).forEach(st => {
          const w = num(st.w), r = parseInt(st.r, 10);
          if (w && w > 0){ mw = Math.max(mw, w); if (r >= 1 && r <= 15) rm = Math.max(rm, w * (1 + r / 30)); }
        });
        if (!rm) return;
        const nom = names[id] || LEGACY[id] || "Ejercicio";
        if (!mapa[nom]) mapa[nom] = [];
        mapa[nom].push({ d:s.date, rm:rm, mw:mw });
      });
    });
  });
  Object.keys(mapa).forEach(k => mapa[k].sort((a, b) => a.d < b.d ? -1 : 1));
  return mapa;
}
function mini(pts, W, H, grande){
  if (pts.length < 2) return "";
  const vs = pts.map(p => p.rm), mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs);
  const r = (mx - mn) || 1, pd = grande ? 14 : 3;
  const x = i => pd + i * (W - 2*pd) / (pts.length - 1), y = v => H - pd - (v - mn) / r * (H - 2*pd);
  let s = '<svg class="' + (grande ? "gbig" : "spark") + '" viewBox="0 0 ' + W + ' ' + H + '"><path d="M' + pts.map((p,i) => x(i).toFixed(1) + " " + y(p.rm).toFixed(1)).join(" L") + '"/>';
  if (grande) pts.forEach((p, i) => { s += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.rm).toFixed(1) + '" r="3.5"/>'; });
  return s + '</svg>';
}
function vistaRecords(cont){
  const m = historialFuerza(), nombres = Object.keys(m);
  if (!nombres.length){ aviso(cont, "Apunta kg y reps en la pestaña Fuerza<br>y aquí verás tu progresión y tus récords 🏆"); return; }
  nombres.sort((a, b) => m[a][m[a].length-1].d < m[b][m[b].length-1].d ? 1 : -1);
  nombres.forEach(nom => {
    const p = m[nom], u = p[p.length - 1], ant = p.length > 1 ? p[p.length - 2] : null;
    const mejor = Math.max.apply(null, p.map(x => x.rm));
    const record = u.rm >= mejor - 0.01 && p.length > 1;
    const dif = ant ? u.rm - ant.rm : 0;
    const c = tarjeta(cont,
      '<div class="rech"><span class="rn">' + esc(nom) + (record ? ' <span class="copa">🏆 récord</span>' : '') + '</span>' + mini(p.slice(-10), 70, 26) + '</div>' +
      '<div class="recd"><span class="rv">' + f1(u.rm) + '<small> kg 1RM</small></span>' +
      (ant ? '<span class="rdif ' + (dif > 0.01 ? "sube" : dif < -0.01 ? "baja" : "") + '">' + (dif > 0.01 ? "▲ +" : dif < -0.01 ? "▼ " : "= ") + f1(dif) + '</span>' : '') +
      '<span class="rmax">máx. levantado ' + f1(Math.max.apply(null, p.map(x => x.mw))) + ' kg</span></div>' +
      (recAbierto === nom ? '<div class="rbig">' + mini(p, 320, 120, true) +
        '<div class="rfech"><span>' + fmtDate(p[0].d) + '</span><span>' + p.length + ' sesiones</span><span>' + fmtDate(u.d) + '</span></div></div>' : ''), "rec");
    c.onclick = () => { recAbierto = recAbierto === nom ? null : nom; renderProgreso(); };
  });
  tarjeta(cont, '<div class="expl"><b>1RM estimado</b>: el peso que podrías mover una sola vez, calculado con tus kg y repeticiones (fórmula de Epley). Toca un ejercicio para ver su evolución.</div>', "suave");
}

/* ---------- AÑO ---------- */
function nivelDia(s){ return !s ? 0 : s < 2700 ? 1 : s < 5400 ? 2 : s < 9000 ? 3 : 4; }
function vistaAnio(cont){
  const y = anioSel || TODAY.slice(0, 4);
  const nav = document.createElement("div");
  nav.className = "calbar";
  nav.innerHTML = '<button class="nav" data-d="-1">‹</button><span class="tit">' + y + '</span><button class="nav" data-d="1"' + (y >= TODAY.slice(0,4) ? ' disabled style="opacity:.3"' : '') + '>›</button>';
  nav.querySelectorAll(".nav").forEach(b => b.onclick = () => {
    const n = parseInt(y, 10) + parseInt(b.dataset.d, 10);
    if (String(n) > TODAY.slice(0,4)) return;
    anioSel = String(n); renderProgreso();
  });
  cont.appendChild(nav);

  const acts = actividadesTodas().filter(a => a.d && a.d.slice(0, 4) === y);
  const porDia = {};
  acts.forEach(a => { porDia[a.d] = (porDia[a.d] || 0) + (a.s || 1); });
  const km = acts.reduce((s, a) => s + (a.km || 0), 0), up = acts.reduce((s, a) => s + (a.up || 0), 0);
  const seg = acts.reduce((s, a) => s + (a.s || 0), 0), diasE = Object.keys(porDia).length;
  // rachas
  let actual = 0, d = porDia[TODAY] ? TODAY : sumaDias(TODAY, -1);
  if (y === TODAY.slice(0,4)) while (porDia[d]){ actual++; d = sumaDias(d, -1); }
  let larga = 0, run = 0;
  for (let dd = y + "-01-01"; dd.slice(0,4) === y && dd <= TODAY; dd = sumaDias(dd, 1)){
    if (porDia[dd]){ run++; larga = Math.max(larga, run); } else run = 0;
  }
  tarjeta(cont, '<div class="kpis cuatro">' +
    '<div><span class="k">Horas</span><span class="v">' + sumaDur(seg) + '</span></div>' +
    '<div><span class="k">Sesiones</span><span class="v">' + acts.length + '</span></div>' +
    '<div><span class="k">Kilómetros</span><span class="v">' + Math.round(km).toLocaleString("es-ES") + '</span></div>' +
    '<div><span class="k">Desnivel +</span><span class="v">' + Math.round(up).toLocaleString("es-ES") + '<small> m</small></span></div></div>' +
    '<div class="rachas"><span>📅 ' + diasE + ' días entrenados</span><span>🔥 Racha actual <b>' + actual + '</b></span><span>🏅 Más larga <b>' + larga + '</b></span></div>');

  // mapa de calor por meses
  const mes = document.createElement("div");
  mes.className = "anio";
  let h = "";
  for (let m = 0; m < 12; m++){
    const p1 = isoLocal(new Date(parseInt(y,10), m, 1));
    const ndias = new Date(parseInt(y,10), m + 1, 0).getDate();
    const off = (new Date(parseInt(y,10), m, 1).getDay() + 6) % 7;
    h += '<div class="mes"><div class="mt">' + MESES_L[m].slice(0,3) + '</div><div class="mg">';
    for (let k = 0; k < off; k++) h += '<i class="v"></i>';
    for (let dd = 1; dd <= ndias; dd++){
      const iso = p1.slice(0, 8) + String(dd).padStart(2, "0");
      h += '<i class="n' + nivelDia(porDia[iso]) + (iso === TODAY ? " hoy" : "") + (iso > TODAY ? " fut" : "") + '"></i>';
    }
    h += '</div></div>';
  }
  mes.innerHTML = h;
  cont.appendChild(mes);
  tarjeta(cont, '<div class="ley2"><span>menos</span><i class="n0"></i><i class="n1"></i><i class="n2"></i><i class="n3"></i><i class="n4"></i><span>más</span></div>', "fina");

  // por deporte
  const dep = {};
  acts.forEach(a => { const k = deporteDe(a.t); if (!dep[k]) dep[k] = { s:0, km:0, up:0, n:0 }; dep[k].s += a.s || 0; dep[k].km += a.km || 0; dep[k].up += a.up || 0; dep[k].n++; });
  let x = '<div class="stit" style="margin:0 0 4px">Por deporte</div>';
  DEPORTES.forEach(D => {
    const v = dep[D.k]; if (!v) return;
    x += '<div class="dep"><span class="i">' + D.i + '</span><span class="nm">' + D.n + ' <span style="color:var(--faint)">· ' + v.n + '</span></span>' +
         '<span class="v"><b>' + sumaDur(v.s) + '</b>' + (D.km && v.km ? ' · ' + f1(v.km) + ' km' : '') +
         (D.up && v.up ? '<small>' + Math.round(v.up).toLocaleString("es-ES") + ' m+</small>' : '') + '</span></div>';
  });
  if (dep.otros) x += '<div class="dep"><span class="i">•</span><span class="nm">Otros · ' + dep.otros.n + '</span><span class="v"><b>' + sumaDur(dep.otros.s) + '</b></span></div>';
  tarjeta(cont, x);
}

function finalizar(day){
  const s = data.cur[day.id];
  const el = document.getElementById("saveState");
  if (!sessHasData(s)){ el.textContent = "nada que guardar"; el.classList.remove("ok"); return; }
  if (!finArmed){
    finArmed = true;
    clearTimeout(finTimer);
    finTimer = setTimeout(() => { finArmed = false; if (currentView === "day") renderDay(); }, 4000);
    renderDay();
    return;
  }
  finArmed = false; clearTimeout(finTimer);
  s.date = TODAY;
  s.fin = Date.now();
  if (!data.hist[day.id]) data.hist[day.id] = [];
  data.hist[day.id].push(s);
  data.cur[day.id] = null;
  scheduleSave();
  currentView = "hist";
  render();
}

function addCustom(dayId, name){
  name = (name || "").trim();

      });
      h += '</div><button class="addset">+ añadir serie</button>';

      const past = pastSessions(currentDay, ex.id);
      if (past.length) h += '<div class="prev">Última vez (' + fmtDate(past[0].date) + '): <b>' + esc(fmtSets(past[0].e.sets)) + '</b></div>';
      h += '<div class="hist' + (histOpen ? " open" : "") + '">';
      if (past.length) past.slice(0,8).forEach(p => {
        h += '<div class="hist-row"><span class="d">' + fmtDate(p.date) + '</span><span>' + esc(fmtSets(p.e.sets)) + '</span></div>';
      });
      else h += '<div class="hist-empty">sin registros anteriores</div>';
      h += '</div>';
      card.innerHTML = h;

      card.querySelector(".ex-check").onclick = () => { st.done = !st.done; scheduleSave(); renderDay(); };
      card.querySelector(".hbtn").onclick = () => {
        if (openHists.has(ex.id)) openHists.delete(ex.id); else openHists.add(ex.id);
        renderDay();
      };
      const dx = card.querySelector(".delex");
      if (dx) dx.onclick = () => delCustom(currentDay, ex.id);
      card.querySelector(".addset").onclick = () => {
        if (st.sets.length < 8){ st.sets.push({w:"",r:""}); scheduleSave(); renderDay(); }
      };
      const del = card.querySelector(".delset");
      if (del) del.onclick = () => { st.sets.pop(); scheduleSave(); renderDay(); };
      card.querySelectorAll("input").forEach(inp => {
        inp.oninput = () => {
          const i = parseInt(inp.closest(".setrow").dataset.i, 10);
          st.sets[i][inp.dataset.f] = inp.value.trim();
          scheduleSave(); updateProgress();
        };
      });
      ss.appendChild(card);
    });
    cont.appendChild(ss);
  });

  // añadir ejercicio propio
  const add = document.createElement("div");
  add.className = "addex";
  add.innerHTML = '<div class="addex-row"><input type="text" placeholder="Nombre del ejercicio" maxlength="48"><button>Añadir</button></div>' +
                  '<div class="tip">Se guarda en este día con sus casillas de kg y reps.</div>';
  const ai = add.querySelector("input"), ab = add.querySelector("button");
  ab.onclick = () => { addCustom(currentDay, ai.value); };
  ai.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); addCustom(currentDay, ai.value); } };
  cont.appendChild(add);

  if (groups.length){
    const fin = document.createElement("button");
    fin.className = "finbtn";
    fin.textContent = finArmed ? "¿Seguro? Toca otra vez para archivar" : "✓ Finalizar sesión y guardar";
    fin.onclick = () => finalizar(day);
    cont.appendChild(fin);
  }
  updateProgress();

  function updateProgress(){
    let t = 0, d = 0;
    allEx(currentDay).forEach(ex => { t++; if (ensureEx(currentDay, ex).done) d++; });
    document.getElementById("progress").textContent = t ? (d + "/" + t + " hechos") : "";
  }
}

function cajaCopia(cont){
  const c = document.createElement("div");
  c.className = "copia";
  c.innerHTML = '<h3>Copia de seguridad</h3>' +
    '<p>Guarda tus pesos, sesiones, notas y avituallamiento antes de borrar o reinstalar la app. Copia, pégalo en Notas, y luego usa «Pegar copia» para recuperarlo.</p>' +
    '<div class="bt"><button data-a="copiar">📋 Copiar mis datos</button><button data-a="pegar">📥 Pegar copia</button></div>' +
    '<div class="ok"></div>';
  const aviso = c.querySelector(".ok");
  const decir = t => { aviso.textContent = t; aviso.style.display = "block"; };

  c.querySelector('[data-a="copiar"]').onclick = async () => {
    const txt = JSON.stringify({ app:"entreno", v:3, hist:data.hist, cur:data.cur, custom:data.custom, notas:data.notas || {}, nutri:data.nutri || {}, bidon:data.bidon || 0.75 });
    let ok = false;
    try{ await navigator.clipboard.writeText(txt); ok = true; }catch(e){}
    if (ok){ decir("✓ Copiado. Pégalo en una nota para tenerlo a salvo."); return; }
    let ta = c.querySelector("textarea.out");
    if (!ta){ ta = document.createElement("textarea"); ta.className = "out"; ta.readOnly = true; c.appendChild(ta); }
    ta.value = txt; ta.focus(); ta.select();
    decir("Selecciona todo el texto de abajo y cópialo.");
  };

  c.querySelector('[data-a="pegar"]').onclick = () => {
    let ta = c.querySelector("textarea.in");
    if (!ta){
      ta = document.createElement("textarea");
      ta.className = "in";
      ta.placeholder = "Pega aquí la copia y vuelve a tocar «Pegar copia»";
      c.appendChild(ta); ta.focus();
      decir("Pega el texto en el recuadro y toca otra vez «Pegar copia».");
      return;
    }
    const v = ta.value.trim();
    if (!v) return;
    let o = null;
    try{ o = JSON.parse(v); }catch(e){}
    if (!o || typeof o !== "object" || !o.hist){ decir("Esa copia no se entiende. Comprueba que has pegado el texto completo."); return; }
    if (!confirm("Se sustituirán tus sesiones de fuerza y tus notas por las de la copia. ¿Seguir?")) return;
    data.hist = o.hist || {}; data.cur = o.cur || {}; data.custom = o.custom || {};
    if (o.notas) data.notas = o.notas;
    if (o.nutri) data.nutri = o.nutri;
    if (o.bidon) data.bidon = o.bidon;
    doSave();
    render();
  };
  cont.appendChild(c);
}

/* ================= vista: diario (fuerza + carreras) ================= */
function renderHist(){
  document.documentElement.style.setProperty("--accent", "#C9CEDA");
  const cont = document.getElementById("content");
  const rows = [];

  PLAN.forEach(day => {
    const names = {}; allEx(day.id).forEach(e => names[e.id] = e.n);
    (data.hist[day.id] || []).forEach((sess,i) => {
      const items = [];
      Object.keys(sess.ex || {}).forEach(id => {
        if (exHasData(sess.ex[id])) items.push({ n:names[id] || LEGACY[id] || "Ejercicio", v:fmtSets(sess.ex[id].sets) });
      });
      if (items.length || sess.mob) rows.push({ k:"s", date:sess.date, i:i, day:day, items:items, mob:!!sess.mob });
    });
  });
  rows.sort((x,y) => x.date < y.date ? 1 : (x.date > y.date ? -1 : y.i - x.i));

  cont.innerHTML = "";

  if (!rows.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = 'Aún no hay sesiones finalizadas.<br>Apunta tus pesos y toca «Finalizar sesión».';
    cont.appendChild(e);
    cajaCopia(cont);
    return;
  }

  rows.forEach(r => {
    const c = document.createElement("div");
    if (r.k === "s"){
      c.className = "sesion";
      let x = '<div class="sesion-head"><span class="sesion-day" style="background:' + r.day.color + '">' + (r.day.corto || r.day.num) + '</span>';
      x += '<span class="sesion-date">' + (r.date === TODAY ? "hoy · " : "") + fmtDate(r.date) + '</span>';
      x += '<span class="sesion-count">' + r.items.length + ' ejercicio' + (r.items.length === 1 ? "" : "s") + (r.mob ? " + mov." : "") + '</span></div>';
      r.items.forEach(it => {
        x += '<div class="sesion-row"><span class="n">' + esc(it.n) + '</span><span class="v">' + esc(it.v) + '</span></div>';
      });
      c.innerHTML = x;
    } else {
      const a = r.a;
      const det = [fmtKm(a.km), fmtDur(a.s), fmtRitmo(a.t, a.km, a.s), a.up ? Math.round(a.up) + " m+" : "", a.hr ? Math.round(a.hr) + " ppm" : ""]
        .filter(Boolean).join(" · ");
      c.className = "sesion act";
      let x = '<div class="sesion-head"><span class="sesion-day act">' + icono(a.t) + '</span>';
      x += '<span class="sesion-date">' + (r.date === TODAY ? "hoy · " : "") + fmtDate(r.date) + '</span>';
      x += '<span class="sesion-count">' + esc(a.l ? "carga " + Math.round(a.l) : tipoEs(a.t)) + '</span></div>';
      x += '<div class="actline"><span class="n">' + esc(a.n || a.t || "Actividad") + '</span><span class="v">' + esc(det) + '</span></div>';
      c.innerHTML = x;
    }
    cont.appendChild(c);
  });
  cajaCopia(cont);
}

/* ================= vista: tabla fecha / kg ================= */
function renderTabla(){
  document.documentElement.style.setProperty("--accent", "#C9CEDA");
  const cont = document.getElementById("content");
  cont.innerHTML = "";
  let any = false;

  PLAN.forEach(day => {
    const lista = allEx(day.id).slice();
    const vistos = new Set(lista.map(e => e.id));
    (data.hist[day.id] || []).forEach(s => Object.keys(s.ex || {}).forEach(id => {
      if (!vistos.has(id) && exHasData(s.ex[id])){ vistos.add(id); lista.push({ id:id, n:LEGACY[id] || "Ejercicio" }); }
    }));
    lista.forEach(ex => {
      const past = (data.hist[day.id] || [])
        .map((s,i) => ({ date:s.date, i:i, e:(s.ex || {})[ex.id] }))
        .filter(x => exHasData(x.e));
      if (!past.length) return;
      any = true;
      past.sort((a,b) => a.date < b.date ? 1 : (a.date > b.date ? -1 : b.i - a.i));

      let record = null;
      past.forEach(p => { const b = bestSet(p.e.sets); if (b && (record === null || b.w > record)) record = b.w; });

      const box = document.createElement("div");
      box.className = "tbl";
      let h = '<div class="tbl-h"><span class="tbl-dot" style="background:' + day.color + '"></span>';
      h += '<span class="tbl-name">' + esc(ex.n) + '</span>';
      h += '<span class="tbl-best">' + (record !== null ? "máx " + String(record).replace(".", ",") + " kg" : String(past.length) + " ses.") + '</span></div>';
      h += '<div class="tr head"><span>fecha</span><span class="r">kg</span><span class="r">reps</span></div>';
      past.forEach(p => {
        const b = bestSet(p.e.sets);
        const kg = b ? String(b.w).replace(".", ",") : "—";
        const rp = b && b.r !== "" ? b.r : (p.e.sets.find(s => s.r) ? p.e.sets.find(s => s.r).r : "—");
        const top = (b && record !== null && b.w === record) ? " top" : "";
        h += '<div class="tr' + top + '"><span>' + fmtDate(p.date) + '</span><span class="r kg">' + esc(kg) + '</span><span class="r">' + esc(rp) + '</span></div>';
      });
      box.innerHTML = h;
      cont.appendChild(box);
    });
  });

  if (!any) cont.innerHTML = '<div class="empty">La tabla se llena al finalizar sesiones.<br>Cada ejercicio tendrá su fecha, kg y reps.</div>';
}

/* ================= render ================= */
function render(){
  renderTabs();
  const esFuerza = section === "fuerza";
  const daybar = document.querySelector(".daybar");
  const mob = document.getElementById("mobChip");
  const foot = document.getElementById("foot");
  const plates = document.getElementById("plates");

  plates.style.display = esFuerza ? "flex" : "none";
  if (!esFuerza){
    daybar.style.display = "none";
    mob.style.display = "none";
    foot.style.display = "none";
    if (section === "sem") renderSemanas();
    else if (section === "cal") renderCalendario();
    else if (section === "prog") renderProgreso();
    else renderActividades();
    return;
  }
  renderPlates();
  const dayView = currentView === "day";
  daybar.style.display = dayView ? "flex" : "none";
  mob.style.display = dayView ? "flex" : "none";
  foot.style.display = dayView ? "block" : "none";
  if (currentView === "hist") renderHist();
  else if (currentView === "tabla") renderTabla();
  else renderDay();
}

async function comprobarVersion(){
  try{
    const r = await fetch("index.html?t=" + Date.now(), { cache:"no-store" });
    if (!r.ok) return;
    const t = await r.text();
    const m = t.match(/const VERSION = "([^"]+)"/);
    if (!m || m[1] === VERSION) return;
    const b = document.createElement("div");
    b.className = "nuevaver";
    b.innerHTML = '<span>Hay una versión nueva (v' + esc(m[1]) + ')</span><button>Actualizar</button>';
    b.querySelector("button").onclick = () => location.replace(location.pathname + "?v=" + m[1] + "-" + Date.now());
    document.body.appendChild(b);
  }catch(e){}
}
