<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#15171A">
<title>Fuerza · Plan 4 días</title>
<style>
  :root{
    --bg:#15171A; --surface:#1D2025; --surface2:#24282E; --line:#2E333A;
    --chalk:#E9E6DF; --muted:#9BA0A8; --faint:#6B7078;
    --d1:#E2452E; --d2:#3B82E0; --d3:#E8B00F; --d4:#33A857;
    --accent:var(--d1);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
    --disp:"Avenir Next Condensed","AvenirNextCondensed-DemiBold","Arial Narrow",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--chalk);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.4;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky; top:0; z-index:10;
    background:rgba(21,23,26,.92); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  }
  .hrow{display:flex; align-items:baseline; justify-content:space-between}
  h1{
    font-family:var(--disp); font-weight:600; font-size:22px; letter-spacing:.06em;
    text-transform:uppercase; margin:0;
  }
  h1 .thin{color:var(--muted); font-weight:400}
  #saveState{font-size:12px; color:var(--faint); font-family:var(--mono); transition:color .3s}
  #saveState.ok{color:#5FBF7A}
  #todayLabel{font-size:13px; color:var(--muted); margin-top:2px}

  /* ---- selector de días: discos tipo bumper plate ---- */
  .plates{display:flex; gap:14px; justify-content:space-between; padding:14px 4px 4px}
  .plate{
    flex:1; aspect-ratio:1; max-width:76px; border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:3px solid var(--pc); background:transparent; color:var(--pc);
    font-family:var(--disp); cursor:pointer; position:relative;
    transition:transform .15s ease, background .15s ease, color .15s ease;
  }
  .plate .num{font-size:24px; font-weight:600; line-height:1}
  .plate .lbl{font-size:10px; letter-spacing:.14em; text-transform:uppercase; margin-top:2px; opacity:.85}
  .plate::after{ /* agujero central del disco */
    content:""; position:absolute; width:9px; height:9px; border-radius:50%;
    background:var(--bg); border:2px solid currentColor; top:8px; opacity:.55;
  }
  .plate.on{background:var(--pc); color:#101214; transform:scale(1.06); border-color:var(--pc)}
  .plate.on::after{background:var(--pc)}
  .plate:active{transform:scale(.95)}

  main{padding:16px 14px 90px; max-width:560px; margin:0 auto}

  .daybar{display:flex; align-items:center; justify-content:space-between; margin:2px 2px 14px}
  .scheme{
    font-family:var(--mono); font-size:12px; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:4px 10px;
  }
  .progress{font-family:var(--mono); font-size:12px; color:var(--accent)}

  .chip{
    display:flex; align-items:center; gap:10px; margin:0 2px 16px;
    background:var(--surface); border:1px dashed var(--line); border-radius:12px; padding:10px 12px;
    font-size:14px; color:var(--muted); cursor:pointer; user-select:none;
  }
  .chip .box{width:20px; height:20px; border-radius:6px; border:2px solid var(--faint); flex:none;
    display:flex; align-items:center; justify-content:center; font-size:13px; color:#101214}
  .chip.done{color:var(--chalk)}
  .chip.done .box{background:var(--accent); border-color:var(--accent)}

  /* ---- superseries: espina lateral ---- */
  .ss{position:relative; padding-left:16px; margin-bottom:22px}
  .ss::before{content:""; position:absolute; left:0; top:26px; bottom:6px; width:3px;
    background:var(--accent); border-radius:2px; opacity:.85}
  .ss-label{
    font-family:var(--disp); text-transform:uppercase; letter-spacing:.14em;
    font-size:13px; color:var(--accent); margin:0 0 8px 0; font-weight:600;
  }
  .ss-note{color:var(--faint); font-size:11px; letter-spacing:.05em; text-transform:none; margin-left:6px; font-family:var(--mono)}

  .ex{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:12px 12px 10px; margin-bottom:10px; transition:opacity .2s;
  }
  .ex.done{opacity:.55}
  .ex-head{display:flex; align-items:flex-start; gap:10px}
  .ex-check{
    width:26px; height:26px; border-radius:50%; border:2px solid var(--faint);
    flex:none; margin-top:1px; background:transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:#101214; font-size:15px; font-weight:700;
    transition:background .15s,border-color .15s;
  }
  .ex.done .ex-check{background:var(--accent); border-color:var(--accent)}
  .ex-tit{flex:1; min-width:0}
  .ex-name{font-family:var(--disp); font-size:17px; font-weight:600; letter-spacing:.03em; text-transform:uppercase}
  .ex-cue{font-size:12.5px; color:var(--muted); margin-top:1px}
  .hbtn{
    flex:none; border:none; background:var(--surface2); color:var(--muted);
    width:32px; height:32px; border-radius:9px; cursor:pointer; font-size:15px;
  }
  .hbtn.on{color:var(--accent)}

  .ex-fig{display:flex; justify-content:center; padding:8px 0 2px}
  .ex-fig img{max-width:200px; max-height:150px; width:auto; height:auto}
  .sets{margin-top:10px; display:flex; flex-direction:column; gap:8px}
  .setrow{display:flex; align-items:center; gap:8px}
  .setlbl{font-family:var(--mono); font-size:12px; color:var(--faint); width:22px; flex:none}
  .fld{
    flex:1; display:flex; align-items:center; gap:6px;
    background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:0 10px;
  }
  .fld:focus-within{border-color:var(--accent)}
  .fld input{
    flex:1; width:100%; min-width:0; border:none; background:transparent; color:var(--chalk);
    font-family:var(--mono); font-size:17px; padding:11px 0; outline:none;
  }
  .fld .unit{font-size:11px; color:var(--faint); font-family:var(--mono); flex:none}
  .delset{border:none; background:transparent; color:var(--faint); font-size:17px; width:26px; height:38px; cursor:pointer; flex:none; padding:0}
  .addset{
    margin-top:2px; border:none; background:transparent; color:var(--muted);
    font-size:13px; font-family:var(--mono); cursor:pointer; padding:6px 2px; text-align:left;
  }
  .prev{font-size:12px; color:var(--faint); font-family:var(--mono); margin-top:8px}
  .prev b{color:var(--muted); font-weight:600}

  .hist{margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; display:none}
  .hist.open{display:block}
  .hist-row{display:flex; justify-content:space-between; font-family:var(--mono); font-size:12.5px; padding:3px 0; color:var(--muted)}
  .hist-row .d{color:var(--faint)}
  .hist-empty{font-size:12.5px; color:var(--faint); font-style:italic}

  .finbtn{
    display:block; width:100%; margin:8px 0 4px; padding:15px;
    border:none; border-radius:14px; cursor:pointer;
    background:var(--accent); color:#101214;
    font-family:var(--disp); font-weight:600; font-size:16px;
    letter-spacing:.08em; text-transform:uppercase;
  }
  .finbtn:active{transform:scale(.98)}
  .memwarn{
    margin:0 2px 14px; padding:10px 12px; border-radius:12px; font-size:13px;
    background:#3A2A12; color:#E8B00F; display:none;
  }
  .plate.hist{border-style:dashed}
  .plate.hist::after{display:none}
  .sesion{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px}
  .sesion-head{display:flex; align-items:center; gap:9px; margin-bottom:6px}
  .sesion-day{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:var(--disp); font-weight:600; font-size:14px; color:#101214; flex:none}
  .sesion-date{font-family:var(--disp); text-transform:uppercase; letter-spacing:.06em; font-size:15px; font-weight:600}
  .sesion-count{margin-left:auto; color:var(--faint); font-family:var(--mono); font-size:12px}
  .sesion-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:6px 0; border-top:1px dashed var(--line); font-size:13.5px}
  .sesion-row .n{color:var(--muted); min-width:0}
  .sesion-row .v{font-family:var(--mono); color:var(--chalk); white-space:nowrap}
  .hist-none{color:var(--faint); text-align:center; padding:36px 10px; font-size:14px; line-height:1.6}
  footer{
    text-align:center; color:var(--faint); font-size:11px; font-family:var(--mono);
    padding:24px 0 10px;
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important}
  }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>Fuerza <span class="thin">· plan 4 días</span></h1>
    <span id="saveState"></span>
  </div>
  <div id="todayLabel"></div>
  <div class="plates" id="plates"></div>
</header>

<main>
  <div class="memwarn" id="memwarn">⚠️ En este entorno no hay almacenamiento: los datos se perderán al cerrar.</div>
  <div class="daybar">
    <span class="scheme" id="scheme"></span>
    <span class="progress" id="progress"></span>
  </div>
  <div class="chip" id="mobChip">
    <span class="box" id="mobBox"></span>
    <span>Movilidad antes de empezar · 2×12–15</span>
  </div>
  <div id="content"></div>
  <footer>los datos se guardan automáticamente</footer>
</main>

/* ================= almacenamiento ================= */
const KEY = "fuerza-log-v2";
const OLDKEY = "fuerza-log-v1";
const store = {
  backend: null, mem: {},
  localOk(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }catch(e){ return false; } },
  warn(){ document.getElementById("memwarn").style.display = this.backend === "mem" ? "block" : "none"; },
  async init(){
    if (typeof window.storage !== "undefined" && window.storage && window.storage.get){ this.backend = "claude"; }
    else if (this.localOk()){ this.backend = "local"; }
    else { this.backend = "mem"; }
    this.warn();
  },
  async load(key){
    try{
      let v = null;
      if (this.backend === "claude"){ const r = await window.storage.get(key); v = r && r.value ? r.value : null; }
      else if (this.backend === "local"){ v = localStorage.getItem(key); }
      else { v = this.mem[key] || null; }
      return v ? JSON.parse(v) : null;
    }catch(e){ return null; }
  },
  async save(key, val){
    const s = JSON.stringify(val);
    const backs = [this.backend].concat(["claude","local","mem"].filter(b => b !== this.backend));
    for (const b of backs){
      try{
        if (b === "claude"){ if (!(typeof window.storage !== "undefined" && window.storage && window.storage.set)) continue; await window.storage.set(key, s); }
        else if (b === "local"){ if (!this.localOk()) continue; localStorage.setItem(key, s); }
        else { this.mem[key] = s; }
        if (b !== this.backend){ this.backend = b; this.warn(); }
        return b === "mem" ? "mem" : "ok";
      }catch(e){ /* probar el siguiente respaldo */ }
    }
    return "err";
  }
};

/* ================= estado ================= */
// data.hist[dayId] = [ {date, ex:{exId:{sets:[{w,r}], done}}, mob} ]  sesiones finalizadas
// data.cur[dayId]  = sesión en curso de ese día (o null)
let data = { hist: {}, cur: {} };
let currentDay = "d1";
let currentView = "day";
const openHists = new Set();
let finArmed = false, finTimer = null;

function isoLocal(d){
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
const TODAY = isoLocal(new Date());

function dayObj(id){ return PLAN.find(d => d.id === id); }
function blankSession(){ return { date: TODAY, ex: {}, mob: false }; }
function ensureCur(dayId){
  if (!data.cur[dayId]) data.cur[dayId] = blankSession();
  return data.cur[dayId];
}
function ensureEx(dayId, exId){
  const s = ensureCur(dayId);
  if (!s.ex[exId]) s.ex[exId] = { sets: [{w:"",r:""},{w:"",r:""}], done:false };
  return s.ex[exId];
}
function exHasData(e){ return !!(e && e.sets && e.sets.some(s => (s.w && s.w !== "") || (s.r && s.r !== ""))); }
function sessHasData(s){
  if (!s) return false;
  if (s.mob) return true;
  return Object.keys(s.ex || {}).some(id => exHasData(s.ex[id]) || s.ex[id].done);
}

/* ================= guardado ================= */
let saveTimer = null;
function scheduleSave(){
  const el = document.getElementById("saveState");
  el.textContent = "guardando…"; el.classList.remove("ok");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 600);
}
async function doSave(){
  const el = document.getElementById("saveState");
  const r = await store.save(KEY, data);
  if (r === "ok"){ el.textContent = "guardado ✓"; el.classList.add("ok"); }
  else if (r === "mem"){ el.textContent = "sin guardar (vista previa)"; el.classList.remove("ok"); }
  else { el.textContent = "error al guardar"; el.classList.remove("ok"); }
}

/* ================= histórico ================= */
function pastSessions(dayId, exId){
  const arr = (data.hist[dayId] || [])
    .map((s, i) => ({ date: s.date, i: i, e: (s.ex || {})[exId] }))
    .filter(x => exHasData(x.e));
  arr.sort((a,b) => a.date < b.date ? 1 : (a.date > b.date ? -1 : b.i - a.i));
  return arr;
}
function fmtSets(sets){
  return sets.filter(s => s.w !== "" || s.r !== "")
    .map(s => (s.w !== "" ? s.w : "—") + "×" + (s.r !== "" ? s.r : "—"))
    .join(" · ");
}
function fmtDate(iso){
  const parts = iso.split("-");
  const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return parseInt(parts[2],10) + " " + meses[parseInt(parts[1],10)-1] + (String(new Date().getFullYear()) !== parts[0] ? " " + parts[0].slice(2) : "");
}

/* ================= render ================= */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function renderPlates(){
  const wrap = document.getElementById("plates");
  wrap.innerHTML = "";
  PLAN.forEach(d => {
    const b = document.createElement("button");
    b.className = "plate" + (currentView === "day" && d.id === currentDay ? " on" : "");
    b.style.setProperty("--pc", d.color);
    b.innerHTML = '<span class="num">' + d.num + '</span><span class="lbl">día</span>';
    b.onclick = () => { currentView = "day"; currentDay = d.id; finArmed = false; render(); };
    wrap.appendChild(b);
  });
  const hb = document.createElement("button");
  hb.className = "plate hist" + (currentView === "hist" ? " on" : "");
  hb.style.setProperty("--pc", "#C9CEDA");
  hb.innerHTML = '<span class="num">🕘</span><span class="lbl">historial</span>';
  hb.onclick = () => { currentView = "hist"; finArmed = false; render(); };
  wrap.appendChild(hb);
}

function renderHist(){
  document.documentElement.style.setProperty("--accent", "#C9CEDA");
  const cont = document.getElementById("content");
  const rows = [];
  PLAN.forEach(day => {
    (data.hist[day.id] || []).forEach((sess, i) => {
      const items = [];
      day.groups.forEach(g => g.ex.forEach(ex => {
        const e = (sess.ex || {})[ex.id];
        if (exHasData(e)) items.push({ n: ex.n, v: fmtSets(e.sets) });
      }));
      if (items.length || sess.mob) rows.push({ date: sess.date, i: i, day: day, items: items, mob: !!sess.mob });
    });
  });
  rows.sort((a,b) => a.date < b.date ? 1 : (a.date > b.date ? -1 : b.i - a.i));
  cont.innerHTML = "";
  if (!rows.length){
    cont.innerHTML = '<div class="hist-none">Aún no hay sesiones finalizadas.<br>Apunta tus pesos y toca «Finalizar sesión» al acabar.</div>';
    return;
  }
  rows.forEach(r => {
    const c = document.createElement("div");
    c.className = "sesion";
    let h = '<div class="sesion-head">';
    h += '<span class="sesion-day" style="background:' + r.day.color + '">' + r.day.num + '</span>';
    h += '<span class="sesion-date">' + (r.date === TODAY ? "hoy · " : "") + fmtDate(r.date) + '</span>';
    h += '<span class="sesion-count">' + r.items.length + ' ejercicio' + (r.items.length === 1 ? "" : "s") + (r.mob ? " + mov." : "") + '</span>';
    h += '</div>';
    r.items.forEach(it => {
      h += '<div class="sesion-row"><span class="n">' + esc(it.n) + '</span><span class="v">' + esc(it.v) + '</span></div>';
    });
    c.innerHTML = h;
    cont.appendChild(c);
  });
}

function finalizar(day){
  const s = data.cur[day.id];
  const el = document.getElementById("saveState");
  if (!sessHasData(s)){
    el.textContent = "nada que guardar"; el.classList.remove("ok");
    return;
  }
  if (!finArmed){
    finArmed = true;
    clearTimeout(finTimer);
    finTimer = setTimeout(() => { finArmed = false; if (currentView === "day") renderDay(); }, 4000);
    renderDay();
    return;
  }
  finArmed = false; clearTimeout(finTimer);
  s.date = TODAY;
  if (!data.hist[day.id]) data.hist[day.id] = [];
  data.hist[day.id].push(s);
  data.cur[day.id] = null;
  scheduleSave();
  currentView = "hist";
  render();
}

function renderDay(){
  const day = dayObj(currentDay);
  document.documentElement.style.setProperty("--accent", day.color);
  document.getElementById("scheme").textContent = day.scheme;

  const cur = ensureCur(currentDay);

  // movilidad
  const mobChip = document.getElementById("mobChip");
  const mobBox = document.getElementById("mobBox");
  mobChip.classList.toggle("done", !!cur.mob);
  mobBox.textContent = cur.mob ? "✓" : "";
  mobChip.onclick = () => { cur.mob = !cur.mob; scheduleSave(); renderDay(); };

  // contenido
  const cont = document.getElementById("content");
  cont.innerHTML = "";

  day.groups.forEach(g => {
    const ss = document.createElement("section");
    ss.className = "ss";
    const note = g.note ? '<span class="ss-note">' + esc(g.note) + '</span>' : "";
    ss.innerHTML = '<h2 class="ss-label">' + esc(g.name) + note + '</h2>';

    g.ex.forEach(ex => {
      const st = ensureEx(currentDay, ex.id);

      const card = document.createElement("div");
      card.className = "ex" + (st.done ? " done" : "");

      const histOpen = openHists.has(ex.id);
      let html = '';
      html += '<div class="ex-head">';
      html += '<button class="ex-check" aria-label="marcar hecho">' + (st.done ? "✓" : "") + '</button>';
      html += '<div class="ex-tit"><div class="ex-name">' + esc(ex.n) + '</div><div class="ex-cue">' + esc(ex.c) + '</div></div>';
      html += '<button class="hbtn' + (histOpen ? " on" : "") + '" aria-label="histórico">🕘</button>';
      html += '</div>';

      if (FIGS[ex.id]){
        html += '<div class="ex-fig"><img src="data:image/png;base64,' + FIGS[ex.id] + '" alt="' + esc(ex.n) + '"></div>';
      }

      html += '<div class="sets">';
      st.sets.forEach((s, i) => {
        const wp = ex.bw ? "corporal" : "kg";
        html += '<div class="setrow" data-i="' + i + '">';
        html += '<span class="setlbl">S' + (i+1) + '</span>';
        html += '<div class="fld"><input type="text" inputmode="decimal" placeholder="' + wp + '" value="' + esc(String(s.w)) + '" data-f="w"><span class="unit">kg</span></div>';
        html += '<div class="fld"><input type="text" inputmode="numeric" placeholder="12–15" value="' + esc(String(s.r)) + '" data-f="r"><span class="unit">reps</span></div>';
        html += (st.sets.length > 1 && i === st.sets.length - 1) ? '<button class="delset" aria-label="quitar serie">−</button>' : '<span style="width:26px;flex:none"></span>';
        html += '</div>';
      });
      html += '</div>';
      html += '<button class="addset">+ añadir serie</button>';

      const past = pastSessions(currentDay, ex.id);
      if (past.length){
        html += '<div class="prev">Última vez (' + fmtDate(past[0].date) + '): <b>' + esc(fmtSets(past[0].e.sets)) + '</b></div>';
      }

      html += '<div class="hist' + (histOpen ? " open" : "") + '">';
      if (past.length){
        past.slice(0, 8).forEach(p => {
          html += '<div class="hist-row"><span class="d">' + fmtDate(p.date) + '</span><span>' + esc(fmtSets(p.e.sets)) + '</span></div>';
        });
      } else {
        html += '<div class="hist-empty">sin registros anteriores</div>';
      }
      html += '</div>';

      card.innerHTML = html;

      // eventos
      card.querySelector(".ex-check").onclick = () => { st.done = !st.done; scheduleSave(); renderDay(); };
      card.querySelector(".hbtn").onclick = () => {
        if (openHists.has(ex.id)) openHists.delete(ex.id); else openHists.add(ex.id);
        renderDay();
      };
      card.querySelector(".addset").onclick = () => {
        if (st.sets.length < 6){ st.sets.push({w:"",r:""}); scheduleSave(); renderDay(); }
      };
      const del = card.querySelector(".delset");
      if (del) del.onclick = () => { st.sets.pop(); scheduleSave(); renderDay(); };
      card.querySelectorAll("input").forEach(inp => {
        inp.oninput = () => {
          const row = inp.closest(".setrow");
          const i = parseInt(row.dataset.i, 10);
          st.sets[i][inp.dataset.f] = inp.value.trim();
          scheduleSave();
          updateProgress();
        };
      });

      ss.appendChild(card);
    });
    cont.appendChild(ss);
  });

  // botón de finalizar sesión
  const fin = document.createElement("button");
  fin.className = "finbtn";
  fin.textContent = finArmed ? "¿Seguro? Toca otra vez para archivar" : "✓ Finalizar sesión y guardar";
  fin.onclick = () => finalizar(day);
  cont.appendChild(fin);

  updateProgress();

  function updateProgress(){
    let t = 0, d2 = 0;
    day.groups.forEach(g => g.ex.forEach(ex => {
      t++;
      const st = ensureEx(currentDay, ex.id);
      if (st.done) d2++;
    }));
    document.getElementById("progress").textContent = d2 + "/" + t + " hechos";
  }
}

function render(){
  renderPlates();
  const daybar = document.querySelector(".daybar");
  const mob = document.getElementById("mobChip");
  if (currentView === "hist"){
    daybar.style.display = "none";
    mob.style.display = "none";
    renderHist();
  } else {
    daybar.style.display = "flex";
    mob.style.display = "flex";
    renderDay();
  }
}

/* ================= init ================= */
(async function(){
  const meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const dias = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const now = new Date();
  document.getElementById("todayLabel").textContent =
    dias[now.getDay()] + " " + now.getDate() + " de " + meses[now.getMonth()] + " · sesión de hoy";

  await store.init();
  let loaded = await store.load(KEY);
  if (!loaded){
    // migrar datos de la versión anterior si existen
    const old = await store.load(OLDKEY);
    if (old && old.days){
      loaded = { hist: {}, cur: {} };
      Object.keys(old.days).forEach(dayId => {
        Object.keys(old.days[dayId]).sort().forEach(date => {
          const v = old.days[dayId][date] || {};
          const sess = { date: date, ex: v.ex || {}, mob: !!v.mob };
          if (date === TODAY){ loaded.cur[dayId] = sess; }
          else if (sessHasData(sess)){
            if (!loaded.hist[dayId]) loaded.hist[dayId] = [];
            loaded.hist[dayId].push(sess);
          }
        });
      });
    }
  }
  if (loaded && loaded.hist) data = loaded;
  render();
})();
</script>
