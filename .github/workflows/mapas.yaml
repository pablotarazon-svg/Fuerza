name: Actividades v2

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar actividades y recorridos
        env:
          ICU_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          ICU_KEY: ${{ secrets.INTERVALS_API_KEY }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
          WA_APIKEY: ${{ secrets.WA_APIKEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        run: |
          python3 - <<'PY'
          import base64, datetime, json, os, re, sys, time, urllib.error, urllib.request

          aid = re.sub(r"\s+", "", os.environ.get("ICU_ID") or "")
          key = re.sub(r"\s+", "", os.environ.get("ICU_KEY") or "")
          if not aid or not key:
              sys.exit("Faltan los secretos INTERVALS_ATHLETE_ID / INTERVALS_API_KEY")
          if not aid.startswith("i"):
              aid = "i" + aid
          print("VERSION 12 · Atleta:", aid, "| clave de", len(key), "caracteres")

          auth = base64.b64encode(("API_KEY:" + key).encode()).decode()
          CAB = {"Authorization": "Basic " + auth,
                 "Accept": "application/json",
                 "User-Agent": "fuerza-app/1.0"}

          def pedir(url, avisar=False):
              """Devuelve (datos, codigo). codigo 0 = error de red."""
              req = urllib.request.Request(url, headers=CAB)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.load(r), 200
              except urllib.error.HTTPError as e:
                  cuerpo = e.read().decode("utf-8", "replace")[:200]
                  if avisar:
                      print("   -> HTTP", e.code, cuerpo)
                  return None, e.code
              except Exception as e:
                  if avisar:
                      print("   -> error:", e)
                  return None, 0

          hoy = datetime.date.today()
          desde = hoy - datetime.timedelta(days=370)
          acts, cod = pedir("https://intervals.icu/api/v1/athlete/%s/activities?oldest=%s&newest=%s"
                            % (aid, desde.isoformat(), hoy.isoformat()), avisar=True)
          if acts is None:
              sys.exit("No se pudo descargar la lista de actividades (HTTP %s)" % cod)
          print("Actividades recibidas:", len(acts))

          previos, previasLp = {}, {}
          try:
              with open("runs.json", encoding="utf-8") as f:
                  for a in json.load(f).get("activities", []):
                      if a.get("g"):
                          previos[str(a.get("id"))] = a["g"]
                      if a.get("lp"):
                          previasLp[str(a.get("id"))] = a["lp"]
          except Exception:
              pass
          print("Guardados ya: recorridos", len(previos), "· series", len(previasLp))

          def num(v):
              try:
                  return round(float(v), 2)
              except (TypeError, ValueError):
                  return None

          def puntos_de(d):
              """Saca los pares [lat,lon] de cualquiera de los formatos posibles."""
              if not d:
                  return None
              flujos = d if isinstance(d, list) else (list(d.values()) if isinstance(d, dict) else [])
              lat = lon = pares = None
              for s in flujos:
                  if not isinstance(s, dict):
                      continue
                  tipo = s.get("type") or s.get("name") or ""
                  dat, dat2 = s.get("data"), s.get("data2")
                  if tipo == "latlng":
                      if dat and dat2 and len(dat) == len(dat2):
                          lat, lon = dat, dat2
                      elif dat and isinstance(dat[0], (list, tuple)):
                          pares = dat
                      elif dat and isinstance(dat[0], dict):
                          pares = [[p.get("lat"), p.get("lng") or p.get("lon")] for p in dat]
                  elif tipo in ("lat", "latitude"):
                      lat = dat
                  elif tipo in ("lng", "lon", "longitude"):
                      lon = dat
              if pares is None and lat and lon:
                  pares = list(zip(lat, lon))
              if not pares:
                  return None
              limpios = [p for p in pares
                         if p and len(p) == 2
                         and isinstance(p[0], (int, float)) and isinstance(p[1], (int, float))
                         and abs(p[0]) <= 90 and abs(p[1]) <= 180
                         and (p[0] != 0 or p[1] != 0)]
              if len(limpios) < 10:
                  return None
              paso = max(1, len(limpios) // 60)
              return [[round(p[0], 5), round(p[1], 5)] for p in limpios[::paso][:60]]

          def series(ident, avisar=False):
              """Devuelve la lista de series/laps resumidas, o None."""
              d, cod = pedir("https://intervals.icu/api/v1/activity/%s/intervals" % ident,
                             avisar=avisar)
              if not d:
                  return None
              trozos = []
              if isinstance(d, dict):
                  v = d.get("laps")          # SOLO los laps marcados en el reloj/ciclocomputador
                  if isinstance(v, list):
                      trozos = v
                  if avisar:
                      print("DIAG: laps del dispositivo:", len(d.get("laps") or []),
                            "· series automaticas (ignoradas):", len(d.get("icu_intervals") or []))
              elif isinstance(d, list):
                  trozos = d
              if not trozos:
                  return None
              if avisar and isinstance(trozos[0], dict):
                  print("DIAG: campos de un lap:", sorted(trozos[0].keys())[:25])

              def n(v):
                  try:
                      f = float(v)
                      return round(f, 2) if f == f else None
                  except (TypeError, ValueError):
                      return None

              fuera = []
              for i, t in enumerate(trozos):
                  if not isinstance(t, dict):
                      continue
                  seg = t.get("moving_time") or t.get("elapsed_time")
                  if not seg:
                      continue
                  dist = n(t.get("distance"))
                  np_ = n(t.get("weighted_average_watts")) or n(t.get("icu_weighted_avg_watts")) \
                        or n(t.get("average_watts")) or n(t.get("icu_average_watts"))
                  fuera.append({
                      "n": t.get("label") or t.get("name") or ("S" + str(i+1)),
                      "tp": (t.get("type") or "").upper()[:4],
                      "s": int(seg),
                      "km": round(dist / 1000.0, 3) if dist else None,
                      "w": np_ if np_ else None,
                      "hr": n(t.get("average_heartrate")) or None,
                  })
                  if len(fuera) >= 60:
                      break
              if len(fuera) < 2:
                  return None
              return fuera

          def direcciones(ident):
              corto = str(ident)[1:] if str(ident).startswith("i") else str(ident)
              return [
                  "https://intervals.icu/api/v1/activity/%s/streams.json?types=latlng" % ident,
                  "https://intervals.icu/api/v1/activity/%s/streams.json" % ident,
                  "https://intervals.icu/api/v1/activity/%s/streams" % ident,
                  "https://intervals.icu/api/v1/activity/%s/streams.json" % corto,
              ]

          def trazado(ident, avisar=False):
              for url in direcciones(ident):
                  if avisar:
                      print("DIAG: probando", url.replace("https://intervals.icu", ""))
                  d, cod = pedir(url, avisar=avisar)
                  if d:
                      if avisar:
                          tipos = [s.get("type") for s in d if isinstance(s, dict)] if isinstance(d, list) else list(d)[:10]
                          print("DIAG: respuesta OK · contenido:", tipos)
                      g = puntos_de(d)
                      if avisar:
                          print("DIAG: puntos extraidos:", len(g) if g else 0)
                      if g:
                          return g
              return None

          salida = []
          for a in acts:
              cuando = a.get("start_date_local") or ""
              if not cuando:
                  continue
              dist = num(a.get("distance"))
              salida.append({
                  "id": a.get("id"),
                  "d": cuando[:10],
                  "dt": cuando,
                  "t": a.get("type") or "Other",
                  "n": a.get("name") or "",
                  "km": round(dist / 1000.0, 3) if dist else None,
                  "s": a.get("moving_time") or a.get("elapsed_time"),
                  "st": a.get("elapsed_time") or None,
                  "up": num(a.get("total_elevation_gain")),
                  "hr": num(a.get("average_heartrate")),
                  "l": num(a.get("icu_training_load")),
                  "zh": [int(x) for x in (a.get("icu_hr_zone_times") or a.get("hr_zone_times") or []) if isinstance(x, (int, float))] or None,
                  "np": (num(a.get("icu_weighted_avg_watts")) or num(a.get("weighted_average_watts"))
                         or num(a.get("normalized_watts")) or num(a.get("icu_np"))),
                  "pw": num(a.get("icu_average_watts")) or num(a.get("average_watts")),
              })

          salida.sort(key=lambda x: x["dt"], reverse=True)
          salida = salida[:600]

          conZonas = [a for a in acts if any("zone" in k.lower() for k in a.keys())]
          if conZonas:
              print("DIAG zonas:", sorted(k for k in conZonas[0].keys() if "zone" in k.lower()))
          bicis = [a for a in acts if (a.get("type") or "").endswith("Ride")]
          if bicis:
              campos = sorted(k for k in bicis[0].keys()
                              if "watt" in k.lower() or "np" in k.lower() or "power" in k.lower())
              print("DIAG bici:", bicis[0].get("name"))
              for k in campos:
                  print("   ", k, "=", bicis[0].get(k))
          else:
              print("DIAG: no hay actividades de bici en el periodo")

          conKm = [a for a in salida if a.get("km")]
          if conKm:
              print("DIAG: prueba con", conKm[0]["id"], "-", conKm[0]["n"])
              g = trazado(conKm[0]["id"], avisar=True)
              if g:
                  conKm[0]["g"] = g
              print("DIAG: series de", conKm[0]["id"])
              lp = series(conKm[0]["id"], avisar=True)
              print("DIAG: series encontradas:", len(lp) if lp else 0)
              if lp:
                  conKm[0]["lp"] = lp

          nuevos = sum(1 for a in salida if a.get("g"))
          nuevasLp = sum(1 for a in salida if a.get("lp"))
          for a in salida[:70]:
              clave = str(a["id"])
              if not a.get("g"):
                  if clave in previos:
                      a["g"] = previos[clave]
                  elif nuevos < 40:
                      g = trazado(a["id"])
                      if g:
                          a["g"] = g
                          nuevos += 1
                          time.sleep(0.2)
              if not a.get("lp"):
                  if clave in previasLp:
                      a["lp"] = previasLp[clave]
                  elif nuevasLp < 40:
                      lp = series(a["id"])
                      if lp:
                          a["lp"] = lp
                          nuevasLp += 1
                          time.sleep(0.2)

          print("Recorridos: nuevos", nuevos, "· total", sum(1 for a in salida if a.get("g")))
          print("Series: nuevas", nuevasLp, "· total", sum(1 for a in salida if a.get("lp")))

          # ================= FORMA / FATIGA (bienestar diario) =================
          wel, codW = pedir("https://intervals.icu/api/v1/athlete/%s/wellness?oldest=%s&newest=%s"
                            % (aid, (hoy - datetime.timedelta(days=370)).isoformat(), hoy.isoformat()), avisar=True)
          dias = []
          for w in (wel or []):
              fecha = str(w.get("id") or "")[:10]
              if len(fecha) != 10:
                  continue
              dias.append({"d": fecha,
                           "ctl": num(w.get("ctl") or w.get("icu_ctl")),
                           "atl": num(w.get("atl") or w.get("icu_atl")),
                           "rr": num(w.get("rampRate")),
                           "hrv": num(w.get("hrv")),
                           "rhr": num(w.get("restingHR")),
                           "sue": num(w.get("sleepSecs"))})
          dias.sort(key=lambda x: x["d"])
          print("Forma: HTTP", codW, "·", len(dias), "dias", "· ultimo:", dias[-1] if dias else "-")
          with open("forma.json", "w", encoding="utf-8") as f:
              json.dump({"updated": datetime.datetime.now(datetime.timezone.utc)
                         .replace(microsecond=0, tzinfo=None).isoformat() + "Z",
                         "days": dias}, f, ensure_ascii=False, separators=(",", ":"))

          # ================= CALENDARIO PLANIFICADO (entrenador) =================
          def paso_txt(p, sangria=""):
              """Convierte un paso de workout_doc en una línea legible."""
              lineas = []
              if p.get("reps") and p.get("steps"):
                  lineas.append(sangria + str(p["reps"]) + "x")
                  for q in p["steps"]:
                      lineas += paso_txt(q, sangria + "  ")
                  return lineas
              partes = []
              dur = p.get("duration"); dist = p.get("distance")
              if dur:
                  partes.append((str(int(dur // 60)) + "m" + (str(int(dur % 60)) + "s" if dur % 60 else "")) if dur >= 60 else str(int(dur)) + "s")
              elif dist:
                  partes.append(str(round(dist / 1000, 2)).rstrip("0").rstrip(".") + "km" if dist >= 1000 else str(int(dist)) + "m")
              for k in ("power", "hr", "pace"):
                  t = p.get(k)
                  if isinstance(t, dict):
                      u = t.get("units") or ""
                      if "start" in t and "end" in t:
                          partes.append("%s-%s%s" % (t["start"], t["end"], (" " + u) if u else ""))
                      elif "value" in t:
                          partes.append("%s%s" % (t["value"], (" " + u) if u else ""))
              if p.get("text"):
                  partes.append(str(p["text"]))
              if partes:
                  lineas.append(sangria + "- " + " ".join(str(x) for x in partes))
              return lineas

          desdeP = hoy - datetime.timedelta(days=42)
          hastaP = hoy + datetime.timedelta(days=120)
          evs, codE = pedir("https://intervals.icu/api/v1/athlete/%s/events?oldest=%s&newest=%s"
                            % (aid, desdeP.isoformat(), hastaP.isoformat()), avisar=True)
          plan = []
          for e in (evs or []):
              cuando = e.get("start_date_local") or ""
              if not cuando:
                  continue
              desc = (e.get("description") or "").strip()
              if not desc and isinstance(e.get("workout_doc"), dict):
                  pasos = e["workout_doc"].get("steps") or []
                  desc = "\n".join(l for p in pasos if isinstance(p, dict) for l in paso_txt(p))
              dist = num(e.get("icu_distance_target")) or num(e.get("distance"))
              hora = cuando[11:16] if len(cuando) >= 16 and cuando[11:16] != "00:00" else ""
              plan.append({
                  "id": e.get("id"),
                  "d": cuando[:10],
                  "h": hora,
                  "c": (e.get("category") or "WORKOUT").upper(),
                  "t": e.get("type") or "",
                  "n": e.get("name") or "",
                  "desc": desc[:2500],
                  "s": e.get("moving_time") or None,
                  "km": round(dist / 1000.0, 3) if dist else None,
              })
          plan.sort(key=lambda x: (x["d"], x["h"] or "99"))
          cats = {}
          for p in plan:
              cats[p["c"]] = cats.get(p["c"], 0) + 1
          print("Calendario: HTTP", codE, "·", len(plan), "eventos ·", cats)
          if evs:
              print("DIAG: campos de un evento:", sorted(evs[0].keys())[:30])
          with open("plan.json", "w", encoding="utf-8") as f:
              json.dump({"updated": datetime.datetime.now(datetime.timezone.utc)
                         .replace(microsecond=0, tzinfo=None).isoformat() + "Z",
                         "events": plan}, f, ensure_ascii=False, separators=(",", ":"))

          # ================= ANALISIS: PLANIFICADO FRENTE A LO HECHO =================
          import urllib.parse
          crudo = {str(a.get("id")): a for a in acts}
          ftpAt = 0
          perfil, _c = pedir("https://intervals.icu/api/v1/athlete/%s/profile" % aid)
          if isinstance(perfil, dict):
              at = perfil.get("athlete") or perfil
              ftpAt = num(at.get("icu_ftp")) or num(at.get("ftp")) or 0
          print("FTP del atleta:", ftpAt or "sin dato")

          FAM = {"Run":"correr", "TrailRun":"correr", "VirtualRun":"correr", "Treadmill":"correr",
                 "Hike":"correr", "Walk":"correr", "Ride":"bici", "VirtualRide":"bici",
                 "GravelRide":"bici", "MountainBikeRide":"bici", "EBikeRide":"bici",
                 "EMountainBikeRide":"bici", "MountainBikeRide ":"bici",
                 "Swim":"nadar", "OpenWaterSwim":"nadar",
                 "WeightTraining":"fuerza", "Workout":"fuerza", "Other":"fuerza"}
          def fam(t): return FAM.get(t or "", (t or "").lower())

          def hhmm(s):
              if not s: return "-"
              s = int(round(s)); hh, mm, ss = s // 3600, (s % 3600) // 60, s % 60
              return ("%dh%02d:%02d" % (hh, mm, ss)) if hh else ("%d:%02d" % (mm, ss))

          def dec(v, n=2):
              if v is None: return "-"
              t = ("%." + str(n) + "f") % float(v)
              if "." in t: t = t.rstrip("0").rstrip(".")
              return t.replace(".", ",")

          def pasos_plan(ev):
              """Pasos del entreno planificado con su objetivo de vatios."""
              doc = (crudo_ev.get(str(ev.get("id"))) or {}).get("workout_doc")
              if not isinstance(doc, dict): return []
              fuera = []
              def mete(p):
                  if not isinstance(p, dict): return
                  if p.get("reps") and p.get("steps"):
                      for _ in range(int(p["reps"])):
                          for q in p["steps"]: mete(q)
                      return
                  w = None
                  pw = p.get("power")
                  if isinstance(pw, dict):
                      u = (pw.get("units") or "").lower()
                      v = pw.get("value")
                      if v is None and pw.get("start") is not None and pw.get("end") is not None:
                          v = (float(pw["start"]) + float(pw["end"])) / 2.0
                      if v is not None:
                          w = float(v) * ftpAt / 100.0 if ("%" in u and ftpAt) else float(v)
                  fuera.append({"s": p.get("duration"), "w": w})
              for p in (doc.get("steps") or []): mete(p)
              return fuera

          def analiza(a, ev):
              """Devuelve (porcentaje, lineas_resumen, observaciones)."""
              partes, pesos, res, obs = [], [], [], []

              if ev.get("s"):
                  r = (a.get("s") or 0) / float(ev["s"])
                  partes.append(min(1.0, r)); pesos.append(0.35)
                  res.append("Tiempo: %s de %s planificado (%d%%)" % (hhmm(a.get("s")), hhmm(ev["s"]), round(r*100)))
              elif a.get("s"):
                  res.append("Tiempo: %s" % hhmm(a["s"]))

              if ev.get("km"):
                  r = (a.get("km") or 0) / float(ev["km"])
                  partes.append(min(1.0, r)); pesos.append(0.2)
                  res.append("Distancia: %s de %s km (%d%%)" % (dec(a.get("km")), dec(ev["km"]), round(r*100)))
              elif a.get("km"):
                  res.append("Distancia: %s km" % dec(a["km"]))

              cp = num(ev.get("l")) or num((crudo_ev.get(str(ev.get("id"))) or {}).get("icu_training_load"))
              if cp and a.get("l"):
                  r = a["l"] / float(cp)
                  partes.append(min(1.0, r)); pesos.append(0.25)
                  res.append("Carga: %s de %s (%d%%)" % (dec(a["l"], 0), dec(cp, 0), round(r*100)))
              elif a.get("l"):
                  res.append("Carga: %s" % dec(a["l"], 0))

              if a.get("np"): res.append("NP: %s W · media %s W" % (dec(a["np"], 1), dec(a.get("pw"), 1)))
              if a.get("hr"): res.append("Pulso medio: %s ppm" % dec(a["hr"], 1))
              if a.get("up"): res.append("Desnivel: %s m+" % dec(a["up"], 1))

              # intensidad serie a serie
              pasos = [p for p in pasos_plan(ev) if p.get("w")]
              laps = [l for l in (a.get("lp") or []) if l.get("w")]
              if pasos and laps:
                  tope = max(p["w"] for p in pasos)
                  duros = [p for p in pasos if p["w"] >= tope * 0.75]
                  topeL = max(l["w"] for l in laps)
                  lapsD = [l for l in laps if l["w"] >= topeL * 0.7]
                  if duros and lapsD:
                      n = min(len(duros), len(lapsD)); rs = []
                      for i in range(n):
                          obj, real = duros[i]["w"], lapsD[i]["w"]
                          rs.append(min(1.0, real / obj))
                          d = (real - obj) / obj * 100.0
                          if abs(d) >= 4:
                              obs.append("Serie %d: ibas a %s W y tocaban %s W (%s%d%%)"
                                         % (i+1, dec(real,1), dec(obj,1), "+" if d > 0 else "", round(d)))
                      if rs:
                          partes.append(sum(rs)/len(rs)); pesos.append(0.4)
                      if len(lapsD) < len(duros):
                          obs.append("Hiciste %d series de las %d marcadas" % (len(lapsD), len(duros)))
                      elif not obs:
                          obs.append("Las %d series dentro de los vatios marcados" % n)

              if a.get("zh"):
                  tot = sum(a["zh"]) or 1
                  suave = (a["zh"][0] if len(a["zh"]) > 0 else 0) + (a["zh"][1] if len(a["zh"]) > 1 else 0)
                  obs.append("Reparto: %d%% suave (Z1-Z2) y %d%% en intensidad"
                             % (round(suave/tot*100), round((tot-suave)/tot*100)))

              if not partes: return None, res, obs
              pct = round(sum(p*w for p, w in zip(partes, pesos)) / sum(pesos) * 100)
              return pct, res, obs

          crudo_ev = {str(e.get("id")): e for e in (evs or [])}

          try:
              with open("analisis.json", encoding="utf-8") as f:
                  items = json.load(f).get("items", {})
          except Exception:
              items = {}

          def _llama(url, datos=None, cab=None):
              req = urllib.request.Request(url, data=datos, headers=cab or {})
              with urllib.request.urlopen(req, timeout=45) as r:
                  return r.status

          def avisa(txt):
              """Manda el aviso por los canales que tengan secretos configurados."""
              env = lambda k: re.sub(r"\s+", "", os.environ.get(k) or "")
              enviado = False

              # --- Telegram ---
              tg_tok, tg_chat = env("TG_TOKEN"), env("TG_CHAT")
              if tg_tok and tg_chat:
                  try:
                      cuerpo = urllib.parse.urlencode({
                          "chat_id": tg_chat, "text": txt, "parse_mode": "Markdown"}).encode()
                      print("Telegram enviado (HTTP %s)" %
                            _llama("https://api.telegram.org/bot%s/sendMessage" % tg_tok, cuerpo))
                      enviado = True
                  except urllib.error.HTTPError as e:
                      print("Telegram HTTP", e.code, e.read().decode("utf-8", "replace")[:200])
                  except Exception as e:
                      print("Telegram fallo:", e)

              # --- ntfy (notificacion al movil) ---
              nt = env("NTFY_TOPIC")
              if nt:
                  # admite el nombre del canal o la URL completa que da la app
                  if nt.startswith("http://") or nt.startswith("https://"):
                      destino = nt.rstrip("/")
                  else:
                      serv = (env("NTFY_SERVER") or "https://ntfy.sh").rstrip("/")
                      if not serv.startswith("http"): serv = "https://" + serv
                      destino = serv + "/" + urllib.parse.quote(nt)
                  try:
                      plano = txt.replace("*", "").replace("_", "")
                      cab = {"Title": "Entreno analizado",
                             "Tags": "runner", "Priority": "default",
                             "Content-Type": "text/plain; charset=utf-8"}
                      print("ntfy -> %s (HTTP %s)" % (destino, _llama(destino, plano.encode("utf-8"), cab)))
                      enviado = True
                  except urllib.error.HTTPError as e:
                      print("ntfy HTTP", e.code, e.read().decode("utf-8", "replace")[:200])
                  except Exception as e:
                      print("ntfy fallo:", e)

              # --- WhatsApp (CallMeBot) ---
              tel = re.sub(r"[^0-9+]", "", os.environ.get("WA_PHONE") or "")
              key = env("WA_APIKEY")
              if tel and key:
                  try:
                      url = ("https://api.callmebot.com/whatsapp.php?phone=%s&apikey=%s&text=%s"
                             % (urllib.parse.quote(tel), urllib.parse.quote(key), urllib.parse.quote(txt)))
                      print("WhatsApp enviado (HTTP %s)" % _llama(url))
                      enviado = True
                  except urllib.error.HTTPError as e:
                      print("WhatsApp HTTP", e.code, e.read().decode("utf-8", "replace")[:150])
                  except Exception as e:
                      print("WhatsApp fallo:", e)

              if not enviado:
                  print("Aviso: sin canal configurado (TG_TOKEN+TG_CHAT, NTFY_TOPIC o WA_PHONE+WA_APIKEY)")
              return enviado

          limite = (hoy - datetime.timedelta(days=3)).isoformat()
          nuevos = 0
          for a in salida:
              if a["d"] < limite or str(a["id"]) in items:
                  continue
              cand = [e for e in plan if e["d"] == a["d"] and e["c"] == "WORKOUT"
                      and (not e.get("t") or fam(e["t"]) == fam(a["t"]))]
              if not cand:
                  continue
              ev = cand[0]
              pct, res, obs = analiza(a, ev)
              if pct is None:
                  continue
              veredicto = ("Clavado, entreno completo." if pct >= 95 else
                           "Casi entero, muy bien." if pct >= 85 else
                           "A medias respecto a lo planificado." if pct >= 60 else
                           "Se quedo bastante corto.")
              items[str(a["id"])] = {"d": a["d"], "pct": pct, "n": a["n"], "plan": ev.get("n") or "",
                                     "res": res, "obs": obs, "ver": veredicto}
              txt = ("*%s · %d%% completado*\n_%s_\n\n*Resumen*\n%s\n\n*Observaciones*\n%s"
                     % (a["n"] or "Entreno", pct, ev.get("n") or "Entreno planificado",
                        "\n".join("• " + x for x in res) or "• Sin datos",
                        "\n".join("• " + x for x in obs + [veredicto])))
              if avisa(txt):
                  items[str(a["id"])]["wa"] = True
              nuevos += 1
              print("Analisis:", a["d"], a["n"], "->", pct, "%")

          print("Analisis nuevos:", nuevos, "· guardados:", len(items))
          with open("analisis.json", "w", encoding="utf-8") as f:
              json.dump({"updated": datetime.datetime.now(datetime.timezone.utc)
                         .replace(microsecond=0, tzinfo=None).isoformat() + "Z",
                         "items": items}, f, ensure_ascii=False, separators=(",", ":"))

          datos = {"updated": datetime.datetime.now(datetime.timezone.utc)
                                .replace(microsecond=0, tzinfo=None).isoformat() + "Z",
                   "activities": salida}
          with open("runs.json", "w", encoding="utf-8") as f:
              json.dump(datos, f, ensure_ascii=False, separators=(",", ":"))
          print("Guardadas:", len(salida), "actividades ·", os.path.getsize("runs.json") // 1024, "KB")
          PY

      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs.json plan.json forma.json analisis.json
          git diff --staged --quiet || git commit -m "Actualizar actividades"
          git push
